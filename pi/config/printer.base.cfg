[include printer.filament.cfg]
[include printer.probe.cfg]
[include printer.mesh.cfg]
[include printer.vibration.cfg]
[include printer.creator5.cfg]
[include printer.misc.cfg]
[include AFC/AFC.cfg]
[include printer.afc-standalone.cfg]

# Stock [creator5_beeper] drives the printer's own host PWM buzzer via the
# cmd_pwm binary, which only exists on the printer's own Linux board, not
# here on the SBC. [creator5_remote_beeper] auto-detects this at startup
# (no local cmd_pwm here) and forwards C5_BUZZER over the gadget's 5th
# serial port (ttyGS4, set up by pi/setup-gadget.sh alongside ttyGS0-3) to
# the tunnel bridge's beep control channel instead: printer/c5_bridge.py and
# printer-socat/c5_socat.py both run cmd_pwm on the printer's own board on
# request (see klippy/extras/creator5_remote_beeper.py in Kalico).
# Riding the USB link itself (not the network) means it still works with no
# Wi-Fi/LAN on the printer. This same section also works unchanged for a
# Printer SoC install -- it would just find cmd_pwm locally and use it
# directly, ignoring serial/baud.
[creator5_remote_beeper]
# If this board is pinned to 4 tunnel ports (no ttyGS4 -- see
# pi/c5-tunnel-gadget.sh), uncomment network_host to fall back to Wi-Fi/LAN
# for C5_BUZZER instead of silently disabling it: set it to the printer's
# own IP/hostname, reachable on network_port (default 8411, the tunnel
# bridge's beep network listener in printer-socat/c5_socat.py).
#network_host: 192.168.2.92
#network_port: 8411

[mcu eboard]
serial: /dev/ttyGS2
baud: 460800
restart_method: command

[mcu]
serial: /dev/ttyGS0
baud: 230400
restart_method: command

[mcu eheaterboard]
serial: /dev/ttyGS1
baud: 230400
restart_method: command

[mcu levelboard]
serial: /dev/ttyGS3
baud: 230400
restart_method: command

[board_pins mc_board]
aliases:
    X_STEP=PJ0, X_DIR=PJ1, X_EN=PJ2, X_ENDSTOP=PJ3,  # stepper_x pin step/enable/dir
    Y_STEP=PJ4, Y_DIR=PJ5, Y_EN=PJ6, Y_ENDSTOP=PJ7,  # stepper_y pin step/enable/dir
    Z_STEP=PJ8, Z_DIR=PJ9, Z_EN=PJ10, Z_ENDSTOP=PJ11,  # stepper_z pin step/enable/dir

[stepper_x]
step_pin: PJ4
dir_pin: PJ5
enable_pin: !PJ6
microsteps: 16
rotation_distance: 40.4
endstop_pin:PA15
position_endstop: 0
position_max: 310.0
position_min: -2.0
homing_speed: 80
full_steps_per_rotation: 200
# homing_positive_dir: true
step_pulse_duration: 0.000000100
homing_retract_dist: 5
homing_retract_speed: 30
second_homing_speed: 10

# BJ42D29-30V22
[mclib stepper_x]
# motor_rs: 2.5      # motor phase resistor @ohm
# motor_ls: 0.0045    # motor phase inductance @H
motor_rs: 1.7  #1.8+0.3      # motor phase resistor @ohm
motor_ls: 0.0026  # motor phase inductance @H
motor_km: 0.1729    # torque and back-emf coefficient @N*m/A or V/(rad/s)
bus_voltage: 24.0   # dc bus voltage @V
run_current: 1.8    # 1.5max
hold_current: 1.5  # hold current
interpolate: True   # enale step interpolate or not
# stall_threshold:2.1

[stepper_y]
step_pin: PJ0
dir_pin: !PJ1
enable_pin: !PJ2
microsteps: 16
rotation_distance: 40.4
endstop_pin:!eboard:PA15
position_endstop: 0
position_max: 260.0
position_min: -5.0
homing_speed: 80
full_steps_per_rotation: 200
# homing_positive_dir: false
step_pulse_duration: 0.000000100
homing_retract_dist: 5
homing_retract_speed: 30
second_homing_speed: 10

# BJ42D29-30V23
[mclib stepper_y]
motor_rs: 1.7   #1.1+0.3    # motor phase resistor @ohm
motor_ls: 0.0026    # motor phase inductance @H
motor_km: 0.1729    # torque and back-emf coefficient @N*m/A or V/(rad/s)
bus_voltage: 24.0   # dc bus voltage @V
run_current: 1.8   # 2max
hold_current: 1.5  # hold current
interpolate: True   # enale step interpolate or not

[stepper_z]
step_pin: Z_STEP
dir_pin: Z_DIR
enable_pin: !Z_EN
microsteps: 16
full_steps_per_rotation: 200
step_pulse_duration: 0.000000100
rotation_distance: 8
gear_ratio: 2.4:1
# endstop_pin: PB10
endstop_pin: probe:z_virtual_endstop
# position_endstop: 255
position_max: 270.0
position_min: -10.0
homing_speed: 5
second_homing_speed: 1
homing_retract_dist: 2
homing_retract_speed: 25

# BJ42D29-30V22
[mclib stepper_z]
# motor_rs: 2.5       # motor phase resistor @ohm
# motor_ls: 0.0045    # motor phase inductance @H
motor_rs: 1.7      # motor phase resistor @ohm
motor_ls: 0.0026    # motor phase inductance @H
# motor_rs: 6       # motor phase resistor @ohm
# motor_ls: 0.0095    # motor phase inductance @H
motor_km: 0.1729    # torque and back-emf coefficient @N*m/A or V/(rad/s)
bus_voltage: 24.0   # dc bus voltage @V
run_current: 1.3  # 1.5max
hold_current: 1.1   # hold current
interpolate: True   # enale step interpolate or not
stall_threshold: 0.6

[c5_motion_guard]
# Skipped step and stall detection for X, Y and Z; needs the mainboard
# firmware with mclib_query_status. See config-docs/CREATOR5_MOTION_GUARD.md.
action: warn
slip_limit: 1
# slip_watch: moving   # test mode only: moving, holding or always
# stall_axes: z

[stepper_enable]

[led chamber_led]
white_pin: PB5
hardware_pwm: False
initial_WHITE: 1.0

[heater_fan heat_fan]
pin:eheaterboard:PC11
max_power: 1.0
#kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[heater_fan heat_fan1]
pin:eheaterboard:PA1
max_power: 1.0
heater: extruder1
heater_temp: 50.0

[heater_fan heat_fan2]
pin:eheaterboard:PA6
max_power: 1.0
heater: extruder2
heater_temp: 50.0

[heater_fan heat_fan3]
pin:eheaterboard:PB10
max_power: 1.0
heater: extruder3
heater_temp: 50.0

[fan_generic fanM106]
pin: eboard:PB5

# Mainboard fan (pcb_fan): follows the mainboard MCU's temperature while X, Y
# or Z is powered or a hotend heater is on, from min_speed at on_temp up to
# full at max_temp, off below on_temp (once it's hysteresis below it). It also
# cools the motor drivers, so it runs at least motor_min while X, Y or Z is
# powered.
#
# Heat control fan (heat_ctl_fan, it cools the power supply): the higher of the
# mainboard fan's speed and the supply's estimated load, heater_watts per hotend
# at its heater's duty plus motor_watts while X, Y or Z is powered, reaching
# full at full_watts. At least min_speed while there is any load, heating_min
# while a nozzle has a target, and runon seconds at its last speed (at most
# runon_speed) once the load is gone. See config-docs/CREATOR5_FANS.md.
[fan_generic pcb_fan]
pin: PD14
shutdown_speed: 0
hardware_pwm: false

[fan_generic heat_ctl_fan]
pin: PE14
shutdown_speed: 0
hardware_pwm: false

[temperature_sensor mainboard_mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu

[gcode_macro _PCB_FAN]
variable_on_temp: 54.5
variable_max_temp: 62
variable_min_speed: 0.3
variable_hysteresis: 2
variable_motor_min: 0.4
variable_hold: -1.0
gcode:

# Calibrations hold both fans at one speed, so their vibration doesn't change
# during a measurement: _FANS_HOLD SPEED=0.5, then _FANS_RELEASE.
[gcode_macro _FANS_HOLD]
gcode:
  {% set speed = params.SPEED|default(0.5)|float %}
  SET_GCODE_VARIABLE MACRO=_PCB_FAN VARIABLE=hold VALUE={speed}
  SET_FAN_SPEED FAN=pcb_fan SPEED={speed}
  SET_FAN_SPEED FAN=heat_ctl_fan SPEED={speed}

[gcode_macro _FANS_RELEASE]
gcode:
  SET_GCODE_VARIABLE MACRO=_PCB_FAN VARIABLE=hold VALUE=-1.0

[gcode_macro _PSU_FAN]
variable_heater_watts: 45
variable_motor_watts: 30
variable_full_watts: 120
variable_min_speed: 0.3
variable_heating_min: 0.5
variable_runon: 60
variable_runon_speed: 0.8
variable_runon_left: 0
gcode:

[delayed_gcode _PCB_FAN_TICK]
initial_duration: 2
gcode:
  {% set cfg = printer['gcode_macro _PCB_FAN'] %}
  {% set psu = printer['gcode_macro _PSU_FAN'] %}
  {% set temp = printer['temperature_sensor mainboard_mcu'].temperature %}
  {% set en = printer.stepper_enable.steppers %}
  {% set motors = en.stepper_x or en.stepper_y or en.stepper_z %}
  {% set load = namespace(watts=0.0, target=false) %}
  {% for h in ['extruder', 'extruder1', 'extruder2', 'extruder3'] %}
    {% if h in printer %}
      {% set load.watts = load.watts + psu.heater_watts * printer[h].power %}
      {% if printer[h].target > 0 %}
        {% set load.target = true %}
      {% endif %}
    {% endif %}
  {% endfor %}
  {% if motors %}
    {% set load.watts = load.watts + psu.motor_watts %}
  {% endif %}

  {% set base = printer['fan_generic pcb_fan'].speed %}
  {% if not (motors or load.target) %}
    {% set speed = 0.0 %}
  {% elif temp >= cfg.max_temp %}
    {% set speed = 1.0 %}
  {% elif temp > cfg.on_temp %}
    {% set speed = cfg.min_speed + (1.0 - cfg.min_speed) * (temp - cfg.on_temp) / (cfg.max_temp - cfg.on_temp) %}
  {% elif base > 0 and temp > cfg.on_temp - cfg.hysteresis %}
    {% set speed = cfg.min_speed %}
  {% else %}
    {% set speed = 0.0 %}
  {% endif %}
  {% if motors %}
    {% set speed = [speed, cfg.motor_min]|max %}
  {% endif %}

  {% set psu_current = printer['fan_generic heat_ctl_fan'].speed %}
  {% if load.watts > 0 or load.target %}
    {% set psu_speed = [[load.watts / psu.full_watts, psu.min_speed]|max, 1.0]|min %}
    {% if load.target %}
      {% set psu_speed = [psu_speed, psu.heating_min]|max %}
    {% endif %}
    {% set runon_left = psu.runon %}
  {% elif psu.runon_left > 0 %}
    {% set psu_speed = [psu_current, psu.runon_speed]|min %}
    {% set runon_left = [psu.runon_left - 2, 0]|max %}
  {% else %}
    {% set psu_speed = 0.0 %}
    {% set runon_left = 0 %}
  {% endif %}
  {% set psu_speed = [psu_speed, speed]|max %}
  {% if runon_left != psu.runon_left %}
    SET_GCODE_VARIABLE MACRO=_PSU_FAN VARIABLE=runon_left VALUE={runon_left}
  {% endif %}

  {% if cfg.hold < 0 %}
    {% for fan, want in [('pcb_fan', speed), ('heat_ctl_fan', psu_speed)] %}
      {% set current = printer['fan_generic ' ~ fan].speed %}
      {% if (want - current)|abs >= 0.02 or (want == 0 and current > 0) %}
        SET_FAN_SPEED FAN={fan} SPEED={'%.2f' % want}
      {% endif %}
    {% endfor %}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_PCB_FAN_TICK DURATION=2

[idle_timeout]
timeout:600

[pause_resume]
recover_velocity: 50

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 30000
max_z_velocity: 20
max_z_accel: 300
#max_accel_to_decel:15000
minimum_cruise_ratio: 0.5
square_corner_velocity: 9

[temperature_sensor extruder_servo_value]
sensor_type: Generic 3950
sensor_pin: eboard:PA0

[gcode_arcs]
resolution: 1.0

[force_move]
enable_force_move: True

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT
auto_creator5_start: True

[display_status]

[pid_calibrate]

#[temp_ctrl]

[exclude_object]

[ff_eddy eboard]
mcu: mcu eboard
trigger_threshold: -20

[ff_eddy levelboard]
mcu: mcu levelboard
trigger_threshold: 25

[temperature_sensor adc_current_value]
sensor_type: Generic 3950
sensor_pin: eheaterboard:PC1

# Door switches: pressed while the door is closed. _OC_DOOR is in
# printer.misc.cfg; skipped while a config update hasn't added it yet.
[gcode_button topDoor]
pin: !eheaterboard:PC2
press_gcode:
  {% if 'gcode_macro _OC_DOOR' in printer %}_OC_DOOR DOOR=top STATE=closed{% endif %}
release_gcode:
  {% if 'gcode_macro _OC_DOOR' in printer %}_OC_DOOR DOOR=top STATE=open{% endif %}


[gcode_button frontDoor]
pin: !PE0
press_gcode:
  {% if 'gcode_macro _OC_DOOR' in printer %}_OC_DOOR DOOR=front STATE=closed{% endif %}
release_gcode:
  {% if 'gcode_macro _OC_DOOR' in printer %}_OC_DOOR DOOR=front STATE=open{% endif %}


[gcode_button extruder_pos1]
pin: ^!eheaterboard:PC12
press_gcode:


[gcode_button extruder_pos2]
pin: ^!eheaterboard:PC4
press_gcode:


[gcode_button extruder_pos3]
pin: ^!eheaterboard:PB14
press_gcode:


[gcode_button extruder_pos4]
pin: ^!eheaterboard:PC5
press_gcode:


[gcode_button extruder_grab1]
pin: ^!eheaterboard:PC10
press_gcode:


[gcode_button extruder_grab2]
pin: ^!eheaterboard:PB6
press_gcode:


[gcode_button extruder_grab3]
pin: ^!eheaterboard:PD2
press_gcode:


[gcode_button extruder_grab4]
pin: ^!eheaterboard:PA12
press_gcode:


[hd_home X]
pin: !PA15
offset: 10
speed: 2

[hd_home Y]
pin: !eboard:PA15
offset: -10
speed: 2

[e_stop Z]
#pin: !levelboard:PA2
pin: ^!levelboard:PD0
offset: -8
speed: 5
back_v: 3
error_v : 0.02
main_cycle_cnt : 10
sub_cycle_cnt : 3

[e_stop X]
#pin: !levelboard:PA2
pin: ^!levelboard:PD0
offset: 10
speed: 5
back_v: 3
error_v : 0.02
main_cycle_cnt : 10
sub_cycle_cnt : 3

[e_stop Y]
#pin: !levelboard:PA2
pin: ^!levelboard:PD0
offset: -10
speed: 5
back_v: 3
error_v : 0.02
main_cycle_cnt : 10
sub_cycle_cnt : 3

[safe_z_home]
home_xy_position: 130, 130
speed: 200
z_hop: 10
z_hop_speed: 3
move_to_previous: False

# Pro-only hardware (printer.pro.cfg), only on a Creator 5 Pro
[include printer.model*.cfg]
