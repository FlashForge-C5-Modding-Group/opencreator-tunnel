# Creator 5 Pro only: the chamber heater and the chamber, loop and cool fans
# (M106/M107 P2 and P3). printer.base.cfg includes this file through
# printer.model.cfg, which is written for the printer it runs on: at every boot
# on the printer, or by the Pi installer in tunnel mode. On a Creator 5 it isn't
# included.

[heater_generic chamber_heater]
gcode_id: C
heater_pin:PE13
max_power:0.8
sensor_type:Generic 3950
sensor_pin:PC1
# smooth_time:30
# max_delta: 0.1
control:pid
pid_Kp: 57.53
pid_Ki: 0.147
pid_Kd: 5624.309
#pwm_cycle_time:
min_temp:-100
max_temp:80

[verify_heater chamber_heater]
max_error: 100
heating_gain: 0.1
check_gain_time: 2400
hysteresis: 5

[fan_generic chamber_fan]
pin:PE11
hardware_pwm:False

[heater_fan_throttled chamber_heat_fan]
pin: PD12
hardware_pwm: False
heater: chamber_heater
heater_temp: 50.0
fan_speed: 0.9
# Drop to half speed once within this many degrees of the chamber
# heater's target, instead of holding full airflow (which otherwise
# causes the chamber to hunt around target more than needed).
near_target_speed: 0.5
near_target_delta: 1.5
# Off as soon as the chamber heater's target is 0, even while still warm.
run_while_cooling: False
# Virtual switch (Fans & Outputs): on runs this fan at full speed whenever
# the chamber heater is on, off keeps the throttling above.
full_speed_switch: chamber_heat_fan_full

[gcode_macro C5_MISC_CHAMBER_HEAT_FAN_FULL_ON]
description: Run the chamber heater fan at full speed while the chamber heats
gcode:
  SET_PIN PIN=chamber_heat_fan_full VALUE=1

[gcode_macro C5_MISC_CHAMBER_HEAT_FAN_FULL_OFF]
description: Slow the chamber heater fan down near the chamber target
gcode:
  SET_PIN PIN=chamber_heat_fan_full VALUE=0

[fan_generic chamber_loop_fan]
pin:PB10
hardware_pwm: False

[fan_generic chamber_cool_fan]
pin:PE5
hardware_pwm: False
