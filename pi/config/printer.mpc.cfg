# Kalico MPC helpers. Safe on stock Klipper: every macro checks that the
# heater reports Kalico's pid_profile status and is configured with
# control: mpc, and otherwise behaves like the stock command (or does
# nothing). MPC itself is enabled by printer.kalico_mpc.cfg, which only
# Kalico installs ship. See pi/kalico/README.md.

# M109 is already replaced by AFC (T-to-lane mapping, ooze checks).
# This macro is included after AFC, so M109.1 is AFC's M109. MPC drives
# the modelled block temperature, so the sensor can sit a few degrees off
# target for a long time; wait for a band instead of AFC's +/-1 C.
[gcode_macro M109]
rename_existing: M109.1
description: Set hotend temperature and wait (MPC-aware)
variable_band_below: 2
variable_band_above: 5
gcode:
  {% set s = params.S|default(0)|float %}
  {% set heater = printer.toolhead.extruder %}
  {% set h = 'extruder' if 'T' in params else heater %}
  {% set cfg = printer.configfile.settings[h]|default({}) %}
  {% set mpc = printer[h].pid_profile is defined
               and cfg.control|default('')|lower == 'mpc' %}
  {% if not mpc or s <= 0 or 'D' in params %}
    M109.1 {rawparams}
  {% elif 'T' in params %}
    # Let AFC resolve the lane; its D deadband is symmetric (+/- D/2).
    M109.1 {rawparams} D{band_below * 2}
  {% else %}
    M104 {rawparams}
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM={s - band_below} MAXIMUM={s + band_above}
  {% endif %}

[gcode_macro M190]
rename_existing: M190.1
description: Set bed temperature and wait (MPC-aware)
variable_band_below: 2
variable_band_above: 5
gcode:
  {% set s = params.S|default(0)|float %}
  {% set cfg = printer.configfile.settings.heater_bed|default({}) %}
  {% set mpc = printer.heater_bed.pid_profile is defined
               and cfg.control|default('')|lower == 'mpc' %}
  {% if not mpc or s <= 0 %}
    M190.1 {rawparams}
  {% else %}
    M140 {rawparams}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s - band_below} MAXIMUM={s + band_above}
  {% endif %}

# Sets filament feed-forward for one hotend from the slicer's material
# type. TOOL=0..3 or HEATER=extruder..extruder3 (default: active tool).
[gcode_macro _SET_MPC_MATERIAL]
description: Set heater MPC parameters for a given material
variable_filament_table:
    ## Update this table to adjust material settings
    {
        ## ( density, heat capacity )  # suggested heat capacity range
        "PLA"       : ( 1.25, 2.20 ),  # 1.80 - 2.20
        "PETG"      : ( 1.27, 2.20 ),  # 1.70 - 2.20
        "PCTG"      : ( 1.27, 2.20 ),  # 1.70 - 2.20
        "PC+ABS"    : ( 1.15, 2.20 ),  # 1.50 - 2.20
        "ABS"       : ( 1.06, 2.40 ),  # 1.25 - 2.40
        "ASA"       : ( 1.07, 2.10 ),  # 1.30 - 2.10
        "PA6"       : ( 1.12, 2.50 ),  # 2.00 - 2.50
        "PA"        : ( 1.15, 2.50 ),  # 2.00 - 2.50
        "PC"        : ( 1.20, 1.90 ),  # 1.10 - 1.90
        "TPU"       : ( 1.21, 2.00 ),  # 1.50 - 2.00
        "TPU-90A"   : ( 1.15, 2.00 ),  # 1.50 - 2.00
        "TPU-95A"   : ( 1.22, 2.00 ),  # 1.50 - 2.00
        "ABS-CF"    : ( 1.11, 2.40 ),  # 1.25 - 2.40
        "ASA-CF"    : ( 1.11, 2.10 ),  # 1.30 - 2.10
        "PA6-CF"    : ( 1.19, 2.50 ),  # 2.00 - 2.50
        "PC+ABS-CF" : ( 1.22, 2.20 ),  # 1.50 - 2.20
        "PC+CF"     : ( 1.36, 1.90 ),  # 1.10 - 1.90
        "PLA-CF"    : ( 1.29, 2.20 ),  # 1.80 - 2.20
        "PETG-CF"   : ( 1.30, 2.20 ),  # 1.70 - 2.20
    }
gcode:
  {% set material = params.MATERIAL|default('')|trim|upper %}
  {% if 'TOOL' in params %}
    {% set t = params.TOOL|int %}
    {% set heater = 'extruder' if t == 0 else 'extruder' ~ t %}
  {% else %}
    {% set heater = params.HEATER|default(printer.toolhead.extruder) %}
  {% endif %}
  {% set extruder_config = printer.configfile.settings[heater]|default({}) %}
  {% set mpc = printer[heater].pid_profile is defined
               and extruder_config.control|default('')|lower == 'mpc' %}
  {% if mpc and material %}
    {% if material in filament_table %}
      {% set density = filament_table[material][0] %}
      {% set heat_capacity = filament_table[material][1] %}
      RESPOND PREFIX=🔥 MSG="Configured {heater} MPC for {material}. Density: {density}, Heat Capacity: {heat_capacity}"
    {% else %}
      {% set density = extruder_config.filament_density|default(1.20) %}
      {% set heat_capacity = extruder_config.filament_heat_capacity|default(1.80) %}
      RESPOND PREFIX=🔥 MSG="Unknown material '{material}', using default mpc parameters for {heater}"
    {% endif %}
    MPC_SET HEATER={heater} FILAMENT_DENSITY={density} FILAMENT_HEAT_CAPACITY={heat_capacity}
  {% endif %}

[gcode_macro C5_MPC_CALIBRATE]
description: MPC-calibrate one tool (TOOL=0..3) or all of them (default). Kalico only. TARGET sets the shared target temp (default 210); T0=/T1=/T2=/T3= override it per tool. Picks up each tool before calibrating and saves once at the end.
gcode:
  {% set requested = params.TOOL|default('ALL')|upper %}
  {% set default_target = params.TARGET|default(210)|float %}
  {% set save = params.SAVE|default(1)|int %}
  {% if printer.extruder.pid_profile is not defined %}
    { action_raise_error("MPC needs Kalico; this host is running stock Klipper. Use C5_PID_CALIBRATE.") }
  {% endif %}
  {% if requested not in ['ALL', '0', '1', '2', '3'] %}
    { action_raise_error("Specify TOOL=0..3 or TOOL=ALL") }
  {% endif %}
  {% if save not in [0, 1] %}
    { action_raise_error("SAVE must be 0 or 1") }
  {% endif %}
  {% set tools = [0, 1, 2, 3] if requested == 'ALL' else [requested|int] %}
  {% for tool in tools %}
    {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
    {% if printer.configfile.settings[heater].control|default('')|lower != 'mpc' %}
      { action_raise_error(heater ~ " is not set to control: mpc. Install printer.kalico_mpc.cfg and remove 'control = pid' for it from the SAVE_CONFIG block.") }
    {% endif %}
  {% endfor %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
    G28
  {% endif %}
  {% for tool in tools %}
    T{tool}
    {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
    {% set target = params['T' ~ tool]|default(default_target)|float %}
    MPC_CALIBRATE HEATER={heater} TARGET={target} FAN_BREAKPOINTS={params.FAN_BREAKPOINTS|default(10)}
  {% endfor %}
  AFC_UNSELECT_TOOL
  {% if save %}
    SAVE_CONFIG
  {% endif %}
