# One physical TMC2209 drives the shared extruder motor for T0-T3.  These
# Chopper/PWM values follow stock; 0.70 A approximates its stock current.
# The 0.110-ohm sense resistor is Klipper's default, not hardware-verified.
# Requires matching Kalico host and eBoard MCU firmware.
[tmc2209 extruder]
uart_pin: eboard:PB11
tx_pin: eboard:PB10
uart_address: 0
run_current: 0.70
hold_current: 0.70
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 999999
driver_INDEX_OTPW: True
driver_IHOLDDELAY: 10
driver_TPOWERDOWN: 128
driver_TOFF: 3
driver_HSTRT: 4
driver_HEND: 5
driver_TBL: 1
driver_PWM_OFS: 75
driver_PWM_GRAD: 23
driver_PWM_FREQ: 1
driver_PWM_AUTOSCALE: True
driver_PWM_AUTOGRAD: True
driver_PWM_REG: 8
driver_PWM_LIM: 12

