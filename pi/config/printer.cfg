microsteps: 16
gear_ratio: 6.5:1
rotation_distance: 21.065
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eheaterboard:PC6
sensor_type: Generic 3950
sensor_pin: eheaterboard:PC0
#control: pid
#pid_Kp: 45
#pid_Ki: 3
#pid_Kd: 35
#pwm_cycle_time: 0.1
