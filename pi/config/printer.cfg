# Creator 5 Pro running klipper-c5 on an SBC through the c5-tunnel USB
# bridge. This mirrors opencreator-fs's own file layout (printer.base.cfg,
# printer.macro.cfg, printer.motor.cfg, printer.misc.cfg, printer.creator5.cfg,
# printer.probe/mesh/vibration/filament/override.cfg, AFC/, KAMP_LiTE/) almost
# unchanged -- the only edits anywhere in this config set are: MCU serial
# paths (ttyGS0-3 instead of ttyS2/4/5/7, in printer.base.cfg), dropping
# [creator5_beeper] (host-only cmd_pwm binary, not present on the SBC) for a
# no-op C5_BUZZER macro, and host filesystem paths (virtual_sdcard,
# save_variables, AFC VarFile, the toolchanger's firmwareRes JSON files)
# repointed at ~/printer_data/ for the account running Klippy.
#
# fluidd.cfg is the read-only, git-managed file KIAUH/fluidd-config installs
# (a symlink to ~/fluidd-config/fluidd.cfg) -- keep it, don't edit it.
# mainsail.cfg here is opencreator-fs's own client-macro file (ported over
# since fluidd's default doesn't include the pause/cancel-at-layer macros or
# the Creator 5 PAUSE/RESUME override notes); both are included below.
#
# Heater PIDs, probe z_offset, input shaper and skew settings live in the
# SAVE_CONFIG block below, so PID_CALIBRATE, SHAPER_CALIBRATE and
# PROBE_CALIBRATE followed by SAVE_CONFIG update them in place.

[include printer.override.cfg]
[include printer.base.cfg]
[include printer.macro.cfg]
[include printer.motor.cfg]
[include fluidd.cfg]
[include mainsail.cfg]
[include ./KAMP_LiTE/*.cfg]
[skew_correction]
[include printer.power_loss_recovery.cfg]

[extruder]
step_pin: eboard:PB14
dir_pin: eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
gear_ratio: 6.5:1
rotation_distance: 19.15
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eheaterboard:PC6
sensor_type: Generic 3950
sensor_pin: eheaterboard:PC0
#control: pid
#pid_Kp: 45
#pid_Ki: 3
#pid_Kd: 35
#pwm_cycle_time: 0.1
min_temp: -200
max_temp: 350
min_extrude_temp: -200
pressure_advance:0.02
pressure_advance_smooth_time: 0.02
max_extrude_only_distance:500
max_extrude_cross_section:800
max_extrude_only_velocity:30
max_extrude_only_accel:5000
full_steps_per_rotation:200

# One physical TMC2209 drives the shared extruder motor for T0-T3.  These
# Chopper/PWM values follow stock; 0.70 A approximates its stock current.
# The 0.110-ohm sense resistor is Klipper's default, not hardware-verified.
# Requires matching klipper-c5 host and eBoard MCU firmware.
[tmc2209 extruder]
uart_pin: eboard:PB11
tx_pin: eboard:PB10
uart_address: 0
run_current: 0.70
hold_current: 0.70
sense_resistor: 0.110
interpolate: True
driver_INDEX_OTPW: True
driver_IHOLDDELAY: 10
driver_TPOWERDOWN: 128
driver_TOFF: 3
driver_HSTRT: 4
driver_HEND: 5
driver_TBL: 1
driver_PWM_OFS: 75
driver_PWM_GRAD: 23
driver_PWM_FREQ: 1
driver_PWM_AUTOSCALE: True
driver_PWM_AUTOGRAD: True
driver_PWM_REG: 8
driver_PWM_LIM: 12

[extruder1]
step_pin: eboard:PB14
dir_pin: eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
gear_ratio: 6.5:1
rotation_distance: 19.15
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eheaterboard:PC7
sensor_type: Generic 3950
sensor_pin: eheaterboard:PA4
#control: pid
#pid_Kp: 28.717
#pid_Ki: 12.763
#pid_Kd: 16.153
#pwm_cycle_time: 0.1
min_temp: -200
max_temp: 350
min_extrude_temp: -200
pressure_advance:0.02
pressure_advance_smooth_time: 0.02
max_extrude_only_distance:500
max_extrude_cross_section:800
max_extrude_only_velocity:30
max_extrude_only_accel:5000
full_steps_per_rotation:200

