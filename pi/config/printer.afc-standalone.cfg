# AFC owns T0..T3.  The four stock filament switches are pin_tool_start;
# the separate mechanical dock/grab inputs remain under Creator5Toolchanger.
[AFC_Toolchanger Tools]
type: Toolchanger

[AFC_extruder extruder0]
extruder_name: extruder
creator5_tool_index: 0
auto_load_on_tool_start: False
pin_tool_start: !eheaterboard:PC13
enable_tool_runout: True
debounce_delay: 10
toolchanger_unit: Tools
map: T0
custom_tool_swap: C5_TOOL_SELECT T=0
custom_unselect: C5_TOOL_DOCK
custom_load_cmd: C5_LOAD_SELECTED_TOOL TOOL=0 TEMP=250 LENGTH=20
enable_standalone_purge: False

[AFC_extruder extruder1]
creator5_tool_index: 1
auto_load_on_tool_start: False
pin_tool_start: !eheaterboard:PC14
enable_tool_runout: True
debounce_delay: 10
toolchanger_unit: Tools
map: T1
custom_tool_swap: C5_TOOL_SELECT T=1
custom_unselect: C5_TOOL_DOCK
custom_load_cmd: C5_LOAD_SELECTED_TOOL TOOL=1 TEMP=250 LENGTH=20
enable_standalone_purge: False

[AFC_extruder extruder2]
creator5_tool_index: 2
auto_load_on_tool_start: False
pin_tool_start: !eheaterboard:PC3
enable_tool_runout: True
debounce_delay: 10
toolchanger_unit: Tools
map: T2
custom_tool_swap: C5_TOOL_SELECT T=2
custom_unselect: C5_TOOL_DOCK
custom_load_cmd: C5_LOAD_SELECTED_TOOL TOOL=2 TEMP=250 LENGTH=20
enable_standalone_purge: False

[AFC_extruder extruder3]
creator5_tool_index: 3
auto_load_on_tool_start: False
pin_tool_start: !eheaterboard:PA2
enable_tool_runout: True
debounce_delay: 10
toolchanger_unit: Tools
map: T3
custom_tool_swap: C5_TOOL_SELECT T=3
custom_unselect: C5_TOOL_DOCK
custom_load_cmd: C5_LOAD_SELECTED_TOOL TOOL=3 TEMP=250 LENGTH=20
enable_standalone_purge: False

# AFC's "load lane" (Fluidd, CHANGE_TOOL LANE=extruderN) and GrumpyScreen's AFC
# panel Load (TOOL_LOAD LANE=extruderN) both run C5_LOAD_FILAMENT for that tool
# when no print is running, so heating, bucket purge, cooldown and docking
# happen. AFC's own TOOL_LOAD only picks the tool up. During a print or pause
# both stay AFC's own commands. X and Y must be homed first; see
# _C5_REQUIRE_HOMED.
[gcode_macro CHANGE_TOOL]
rename_existing: _AFC_CHANGE_TOOL
description: Load a lane's tool with C5_LOAD_FILAMENT
gcode:
  {% set lane = params.LANE|default('') %}
  {% if printer.print_stats.state in ['printing', 'paused'] or lane[-1:] not in ['0', '1', '2', '3'] %}
    _AFC_CHANGE_TOOL {rawparams}
  {% else %}
    _C5_REQUIRE_HOMED
    C5_LOAD_FILAMENT TOOL={lane[-1:]}{% if 'NEW_EXTRUDER_TEMP' in params %} TEMP={params.NEW_EXTRUDER_TEMP}{% endif %}{% if 'PURGE_LENGTH' in params %} LENGTH={params.PURGE_LENGTH}{% endif %}
  {% endif %}

[gcode_macro TOOL_LOAD]
rename_existing: _AFC_TOOL_LOAD
description: Load a lane's tool with C5_LOAD_FILAMENT
gcode:
  {% set lane = params.LANE|default('') %}
  {% if printer.print_stats.state in ['printing', 'paused'] or lane[-1:] not in ['0', '1', '2', '3'] %}
    _AFC_TOOL_LOAD {rawparams}
  {% else %}
    _C5_REQUIRE_HOMED
    C5_LOAD_FILAMENT TOOL={lane[-1:]}
  {% endif %}

# A tool change with X or Y not homed can fail part way and leave AFC stuck in
# ToolSwap. Ask the user to home instead, then stop the calling macro.
[gcode_macro _C5_REQUIRE_HOMED]
description: Prompt to home and stop when X or Y is not homed
gcode:
  {% set homed = printer.toolhead.homed_axes %}
  {% if 'x' not in homed or 'y' not in homed %}
    _C5_HOME_PROMPT
    _C5_HOME_ABORT
  {% endif %}

[gcode_macro _C5_HOME_PROMPT]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Home required"
  RESPOND TYPE=command MSG="action:prompt_text The printer is not homed. Home it first, then try again."
  RESPOND TYPE=command MSG="action:prompt_footer_button Home now|_C5_HOME_GO"
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_C5_HOME_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"

# Separate macro: an error raised in the template above would stop it before
# the prompt lines run.
[gcode_macro _C5_HOME_ABORT]
gcode:
  { action_raise_error("Home first (G28), then try again") }

[gcode_macro _C5_HOME_GO]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  G28

[gcode_macro _C5_HOME_CLOSE]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
