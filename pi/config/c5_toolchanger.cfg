# Creator 5 Pro tool changes and tool calibrations for upstream Klipper.
# Reproduces the stock firmwareExe 1.9.9 grab/release sequences and its dock
# position and nozzle offset calibrations. Needs [c5_endstop_probe] and
# [c5_tool_sensors] from klipper-c5.
#
#   CALIBRATE_TOOL_DOCK TOOL=<0-3>  dock position of one tool (once per tool)
#   CALIBRATE_TOOL_OFFSETS          nozzle XY/Z offsets of every docked tool,
#                                   build plate removed
#   T0..T3                          tool change
#   TOOL_DROP                       put the held tool back in its dock
#
# Results are kept in c5_variables.cfg ([save_variables]): dock<n>_x/y,
# t<n>_x/y/z (absolute station centre and trigger height seen by each
# nozzle), tool_current (-1 = none) and the optional per-tool fine tune
# t<n>_z_fine (SAVE_VARIABLE VARIABLE=t1_z_fine VALUE=0.02).
#
# Differences from stock:
# - Tool offsets are relative to T0 in X, Y and Z. Stock also derives T0's
#   Z from the station; here T0's Z comes from PROBE_CALIBRATE (run it with
#   T0 on the carriage), so the station reference measurement is not needed.
# - No automatic retries: a failed grab, release or measurement stops with
#   an error. Temperature waits have no timeout.
# - T<n> activates extruder<n>, so M104/M109 without T follow the tool
#   (stock virtual_sdcard appended T<n> to those lines instead).

########################################
# Endstop probes (stock ESTOP and HDHOME)
########################################

# levelBoard eddy-current station on the bed (stock [e_stop X/Y/Z]).
[c5_endstop_probe station]
pin: ^!levelboard:PD0
axes: xyz
speed: 5
retract: 3
samples: 3
samples_tolerance: 0.02
samples_tolerance_retries: 10
rebaseline: True

# X and Y endstops (stock [hd_home X/Y]); polarity as [stepper_x]/[stepper_y].
[c5_endstop_probe x_endstop]
pin: !PA15
axes: x
speed: 2
retract: 0
samples: 1

[c5_endstop_probe y_endstop]
pin: !eboard:PA15
axes: y
speed: 2
retract: 0
samples: 1

[save_variables]
filename: ~/printer_data/config/c5_variables.cfg

# Dock and carriage-mount sensors, polled by TOOL_SENSOR_WAIT: continue as
# soon as they match, at most 1 s (stock firmwareExe polls 20 x 50 ms).
[c5_tool_sensors]
dock_buttons: extruder_pos1, extruder_pos2, extruder_pos3, extruder_pos4
mount_buttons: extruder_grab1, extruder_grab2, extruder_grab3, extruder_grab4

########################################
# Tool change
########################################

[gcode_macro T0]
gcode:
    _TC_SELECT TOOL=0

[gcode_macro T1]
gcode:
    _TC_SELECT TOOL=1

[gcode_macro T2]
gcode:
    _TC_SELECT TOOL=2

[gcode_macro T3]
gcode:
    _TC_SELECT TOOL=3

# Z hop 1 mm, drop the held tool, pick up the new one and apply its offsets.
# Like stock, no return to the old XY/Z: the slicer's next moves travel
# (at the hopped Z) and then set Z, so returning would only add a move and
# lower a hot nozzle onto the part.
[gcode_macro _TC_SELECT]
gcode:
    {% set i = params.TOOL|int %}
    {% if 'x' not in printer.toolhead.homed_axes
          or 'y' not in printer.toolhead.homed_axes %}
        {action_raise_error("Home X and Y (G28) before a tool change")}
    {% endif %}
    {% set b = 'gcode_button extruder_' %}
    {% set held = 'PRESSED' in (printer[b ~ 'grab1'].state
                                ~ printer[b ~ 'grab2'].state
                                ~ printer[b ~ 'grab3'].state
                                ~ printer[b ~ 'grab4'].state) %}
    {% set cur = printer.save_variables.variables.tool_current|default(-1) %}
    {% set extruder = 'extruder' if i == 0 else 'extruder%d' % i %}
    {% if held and cur == i
          and printer[b ~ 'pos%d' % (i + 1)].state != 'PRESSED' %}
        _TC_APPLY TOOL={i}
        ACTIVATE_EXTRUDER EXTRUDER={extruder}
    {% else %}
        {% set g = printer.gcode_move %}
        M400
        G91
        G1 Z1 F500
        G90
        TOOL_DROP
        _TC_GRAB TOOL={i}
        _TC_APPLY TOOL={i}
        ACTIVATE_EXTRUDER EXTRUDER={extruder}
        G1 F{g.speed}
        {% if not g.absolute_coordinates %}
            G91
        {% endif %}
    {% endif %}

# Stock setGrabGcodeOffsetMgr with T0 as the base tool (see header).
[gcode_macro _TC_APPLY]
gcode:
    {% set i = params.TOOL|int %}
    {% set v = printer.save_variables.variables %}
    {% set t = 't%d_' % i %}
    {% if (t ~ 'x') in v and 't0_x' in v %}
        SET_GCODE_OFFSET X={v[t ~ 'x'] - v.t0_x} Y={v[t ~ 'y'] - v.t0_y} MOVE=1 MOVE_SPEED=100
        SET_GCODE_OFFSET Z={v[t ~ 'z'] - v.t0_z + v[t ~ 'z_fine']|default(0.0)} MOVE=1 MOVE_SPEED=40
    {% else %}
        RESPOND TYPE=error MSG="T{i} offsets unknown (run CALIBRATE_TOOL_OFFSETS); none applied"
    {% endif %}

# Put the held tool back in its own dock. The held tool is tool_current,
# or the only empty dock if tool_current is unknown or wrong (stock
# homeManager/changeExtruderManager).
[gcode_macro TOOL_DROP]
description: Put the tool on the carriage back in its dock
gcode:
    {% set b = 'gcode_button extruder_' %}
    {% set held = 'PRESSED' in (printer[b ~ 'grab1'].state
                                ~ printer[b ~ 'grab2'].state
                                ~ printer[b ~ 'grab3'].state
                                ~ printer[b ~ 'grab4'].state) %}
    {% set cur = printer.save_variables.variables.tool_current|default(-1) %}
    {% if not held %}
        {% if cur != -1 %}
            SAVE_VARIABLE VARIABLE=tool_current VALUE=-1
        {% endif %}
    {% else %}
        {% if cur < 0 or printer[b ~ 'pos%d' % (cur + 1)].state == 'PRESSED' %}
            {% set ns = namespace(empty=[]) %}
            {% for n in range(4) %}
                {% if printer[b ~ 'pos%d' % (n + 1)].state != 'PRESSED' %}
                    {% set ns.empty = ns.empty + [n] %}
                {% endif %}
            {% endfor %}
            {% if ns.empty|length != 1 %}
                {action_raise_error("Cannot tell which tool is on the carriage (%d docks empty)" % (ns.empty|length))}
            {% endif %}
            {% set cur = ns.empty[0] %}
        {% endif %}
        _TC_RELEASE TOOL={cur}
    {% endif %}

########################################
# Grab and release (stock doGrabExtruderLatest/doReleaseExtruderLatest)
########################################

# Optional variables: grab_offset (dock X shift, default 0).

[gcode_macro _TC_GRAB]
gcode:
    {% set i = params.TOOL|int %}
    {% set v = printer.save_variables.variables %}
    {% if ('dock%d_x' % i) not in v %}
        {action_raise_error("T%d dock position unknown: run CALIBRATE_TOOL_DOCK TOOL=%d" % (i, i))}
    {% endif %}
    {% if printer['gcode_button extruder_pos%d' % (i + 1)].state != 'PRESSED' %}
        {action_raise_error("T%d not in dock. Cannot pick up extruder." % i)}
    {% endif %}
    {% set x = v['dock%d_x' % i] + v.grab_offset|default(0.0) %}
    SET_VELOCITY_LIMIT ACCEL=8000
    SET_GCODE_OFFSET X=0 Y=0 MOVE=1 MOVE_SPEED=100
    G1 X250 F30000
    G1 Y{v['dock%d_y' % i]}
    G1 X280
    G1 X{x} F5400
    TOOL_SENSOR_WAIT HELD=1
    _TC_GRAB_LOCK TOOL={i} X={x} ACCEL={printer.toolhead.max_accel}

[gcode_macro _TC_GRAB_LOCK]
gcode:
    {% set i = params.TOOL|int %}
    {% set b = 'gcode_button extruder_' %}
    {% set held = 'PRESSED' in (printer[b ~ 'grab1'].state
                                ~ printer[b ~ 'grab2'].state
                                ~ printer[b ~ 'grab3'].state
                                ~ printer[b ~ 'grab4'].state) %}
    {% if not held %}
        G1 X280
        M400
        MOTOR_RELEASE
        MOTOR_STOP
        SET_VELOCITY_LIMIT ACCEL={params.ACCEL}
        _TC_ERROR MSG="T{i} pickup failed: extruder mount sensor not triggered"
    {% else %}
        MOTOR_GRAB
        G1 X{params.X|float - 20} F3600
        MOTOR_GRAB2
        G1 X250 F3600
        TOOL_SENSOR_WAIT TOOL={i} HELD=1 DOCKED=0
        # Saved while stopped: the file write blocks G-code processing, so
        # between the two pull-out moves it paused the carriage.
        SAVE_VARIABLE VARIABLE=tool_current VALUE={i}
        _TC_GRAB_CHECK TOOL={i} ACCEL={params.ACCEL}
    {% endif %}

[gcode_macro _TC_GRAB_CHECK]
gcode:
    {% set i = params.TOOL|int %}
    {% set b = 'gcode_button extruder_' %}
    {% set held = 'PRESSED' in (printer[b ~ 'grab1'].state
                                ~ printer[b ~ 'grab2'].state
                                ~ printer[b ~ 'grab3'].state
                                ~ printer[b ~ 'grab4'].state) %}
    {% set docked = printer[b ~ 'pos%d' % (i + 1)].state == 'PRESSED' %}
    MOTOR_STOP
    SET_VELOCITY_LIMIT ACCEL={params.ACCEL}
    {% if docked or not held %}
        SAVE_VARIABLE VARIABLE=tool_current VALUE=-1
        _TC_ERROR MSG="State error after T{i} pickup (dock sensor {'still triggered' if docked else 'ok'}, mount sensor {'ok' if held else 'not triggered'})"
    {% endif %}

[gcode_macro _TC_RELEASE]
gcode:
    {% set i = params.TOOL|int %}
    {% set v = printer.save_variables.variables %}
    {% if ('dock%d_x' % i) not in v %}
        {action_raise_error("T%d dock position unknown: run CALIBRATE_TOOL_DOCK TOOL=%d" % (i, i))}
    {% endif %}
    {% if printer['gcode_button extruder_pos%d' % (i + 1)].state == 'PRESSED' %}
        {action_raise_error("T%d already in dock. Cannot release extruder." % i)}
    {% endif %}
    {% set x = v['dock%d_x' % i] + v.grab_offset|default(0.0) %}
    SET_VELOCITY_LIMIT ACCEL=8000
    SET_GCODE_OFFSET X=0 Y=0 MOVE=1 MOVE_SPEED=100
    G1 X250 F30000
    G1 Y{v['dock%d_y' % i]}
    G1 X{x - 10}
    G1 X{x} F5400
    TOOL_SENSOR_WAIT TOOL={i} DOCKED=1
    _TC_RELEASE_UNLOCK TOOL={i} ACCEL={printer.toolhead.max_accel}

# MOTOR_RELEASE stops with an error if the gear stepper endstop does not
# trigger (stock waited for "endstop triggered" instead).
[gcode_macro _TC_RELEASE_UNLOCK]
gcode:
    {% set i = params.TOOL|int %}
    {% if printer['gcode_button extruder_pos%d' % (i + 1)].state != 'PRESSED' %}
        SET_VELOCITY_LIMIT ACCEL={params.ACCEL}
        _TC_ERROR MSG="T{i} release failed: extruder dock sensor not triggered"
    {% else %}
        MOTOR_RELEASE
        G1 X250 F4800
        TOOL_SENSOR_WAIT TOOL={i} HELD=0 DOCKED=1
        SAVE_VARIABLE VARIABLE=tool_current VALUE=-1
        _TC_RELEASE_CHECK TOOL={i} ACCEL={params.ACCEL}
    {% endif %}

[gcode_macro _TC_RELEASE_CHECK]
gcode:
    {% set i = params.TOOL|int %}
    {% set b = 'gcode_button extruder_' %}
    {% set held = 'PRESSED' in (printer[b ~ 'grab1'].state
                                ~ printer[b ~ 'grab2'].state
                                ~ printer[b ~ 'grab3'].state
                                ~ printer[b ~ 'grab4'].state) %}
    {% set docked = printer[b ~ 'pos%d' % (i + 1)].state == 'PRESSED' %}
    MOTOR_STOP
    SET_VELOCITY_LIMIT ACCEL={params.ACCEL}
    {% if held or not docked %}
        _TC_ERROR MSG="State error after T{i} release (mount sensor {'still triggered' if held else 'ok'}, dock sensor {'ok' if docked else 'not triggered'})"
    {% endif %}

# Raise an error after the preceding commands of the calling macro ran.
[gcode_macro _TC_ERROR]
gcode:
    {action_raise_error(params.MSG|default("Tool change failed"))}

########################################
# Dock position calibration (stock cmdXYCalibrationManualFrontHome)
########################################

# The carriage is pushed onto the docked tool by hand (motors off). The
# frame is set to the nominal dock position, the tool is pulled out, and the
# X/Y endstop trigger positions give the true dock coordinates.
[gcode_macro CALIBRATE_TOOL_DOCK]
description: Measure the dock position of one tool (TOOL=0-3)
gcode:
    {% set i = params.TOOL|default(-1)|int %}
    {% if i < 0 or i > 3 %}
        {action_raise_error("CALIBRATE_TOOL_DOCK needs TOOL=0-3")}
    {% endif %}
    {% set b = 'gcode_button extruder_' %}
    {% set held = 'PRESSED' in (printer[b ~ 'grab1'].state
                                ~ printer[b ~ 'grab2'].state
                                ~ printer[b ~ 'grab3'].state
                                ~ printer[b ~ 'grab4'].state) %}
    {% if not held or printer[b ~ 'pos%d' % (i + 1)].state != 'PRESSED' %}
        {action_raise_error("Run M84, push the carriage onto the docked T%d until it latches, then run CALIBRATE_TOOL_DOCK TOOL=%d again" % (i, i))}
    {% endif %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    SET_KINEMATIC_POSITION X=295 Y={80 + 50 * i} SET_HOMED=XY
    # Lock the tool as a pickup does (the traced stock dock routine sends no
    # lock, but without one the tool stays in the dock).
    G4 P1000
    MOTOR_GRAB
    G1 X275 F4800
    MOTOR_GRAB2
    G1 X245 F2400
    TOOL_SENSOR_WAIT TOOL={i} DOCKED=0
    _TC_DOCK_MEASURE TOOL={i}

[gcode_macro _TC_DOCK_MEASURE]
gcode:
    {% set i = params.TOOL|int %}
    {% if printer['gcode_button extruder_pos%d' % (i + 1)].state == 'PRESSED' %}
        G1 X295 F3000
        M400
        MOTOR_RELEASE
        G1 X240 F12000
        M84
        _TC_ERROR MSG="T{i} stayed in its dock: push the carriage on until it latches"
    {% else %}
        G1 X5 F6000
        ENDSTOP_PROBE NAME=x_endstop AXIS=X TARGET=-5
        G1 Y35 F6000
        ENDSTOP_PROBE NAME=y_endstop AXIS=Y TARGET=0
        _TC_DOCK_SAVE TOOL={i}
    {% endif %}

[gcode_macro _TC_DOCK_SAVE]
gcode:
    {% set i = params.TOOL|int %}
    {% set y0 = 80 + 50 * i %}
    {% set dx = (295 - printer['c5_endstop_probe x_endstop'].last_result)|abs %}
    {% set dy = y0 - printer['c5_endstop_probe y_endstop'].last_result %}
    SAVE_VARIABLE VARIABLE=dock{i}_x VALUE={'%.3f' % dx}
    SAVE_VARIABLE VARIABLE=dock{i}_y VALUE={'%.3f' % dy}
    RESPOND MSG="T{i} dock: X={'%.3f' % dx} Y={'%.3f' % dy}"
    M400
    G1 X240 F12000
    G1 Y{y0}
    G1 X295 F3000
    M400
    G4 P1000
    MOTOR_RELEASE
    G4 P1000
    MOTOR_STOP
    G1 X240 F12000
    M400
    M84

########################################
# Nozzle offset calibration (stock testOffset/calibration_center_manager)
########################################

[gcode_macro _TC_STATE]
variable_zref: 0.0
variable_zw: 0.0
variable_z: 0.0
variable_sx: 0.0
variable_sy: 0.0
variable_x1: 0.0
variable_y2: 0.0
variable_x3: 0.0
variable_y4: 0.0
variable_accel: 20000.0
gcode:

# VAR=<name> [SOURCE=probe|<c5_endstop_probe name>]: store the last result.
[gcode_macro _TC_STORE]
gcode:
    {% set src = params.SOURCE|default('station') %}
    {% if src == 'probe' %}
        {% set value = printer.probe.last_z_result %}
    {% else %}
        {% set value = printer['c5_endstop_probe ' ~ src].last_result %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TC_STATE VARIABLE={params.VAR} VALUE={value}

[gcode_macro CALIBRATE_TOOL_OFFSETS]
description: Measure the nozzle offsets of every docked tool (build plate removed)
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Home all axes (G28) first")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TC_STATE VARIABLE=accel VALUE={printer.toolhead.max_accel}
    G1 Z10 F1200
    TOOL_DROP
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=1 MOVE_SPEED=600
    G1 X43 Y226 F12000
    M400
    PROBE SAMPLES=3 SAMPLES_TOLERANCE=0.1 SAMPLES_TOLERANCE_RETRIES=3
    _TC_STORE VAR=zref SOURCE=probe
    G1 Z10 F1200
    G1 X28.5 Y214.5 F12000
    M400
    PROBE SAMPLES=3 SAMPLES_TOLERANCE=0.1 SAMPLES_TOLERANCE_RETRIES=3
    G1 Z10 F1200
    _TC_CHECK_PLATE
    _TC_CAL_TOOL TOOL=0
    _TC_CAL_TOOL TOOL=1
    _TC_CAL_TOOL TOOL=2
    _TC_CAL_TOOL TOOL=3
    G1 Z100 F1200
    RESPOND MSG="Tool offsets saved; refit the build plate"

# Stock checkPlatformRemove: the two probe points only differ by 0.8 mm or
# more when the station is exposed.
[gcode_macro _TC_CHECK_PLATE]
gcode:
    {% if (printer['gcode_macro _TC_STATE'].zref
           - printer.probe.last_z_result)|abs < 0.8 %}
        G1 Z100 F1200
        _TC_ERROR MSG="Remove the build plate before CALIBRATE_TOOL_OFFSETS"
    {% endif %}

[gcode_macro _TC_CAL_TOOL]
gcode:
    {% set i = params.TOOL|int %}
    {% set heater = 'extruder' if i == 0 else 'extruder%d' % i %}
    {% if printer['gcode_button extruder_pos%d' % (i + 1)].state != 'PRESSED' %}
        RESPOND MSG="T{i} is not in its dock; skipped"
    {% else %}
        _TC_CLEAN TOOL={i}
        _TC_MEASURE KEY=t{i} SX=16.0 SY=214.5
        SET_HEATER_TEMPERATURE HEATER={heater} TARGET=0
        G1 Z10 F1200
        _TC_RELEASE TOOL={i}
    {% endif %}

# Stock clearNozzleEddy: probe the wiper height, grab the tool, heat to
# 220 C, purge 50 mm, wipe and cool to 120 C resting on the wiper pad.
[gcode_macro _TC_CLEAN]
gcode:
    SET_GCODE_OFFSET X=0 Y=0 MOVE=1 MOVE_SPEED=600
    M400
    G1 X250 F12000
    G1 Y4.8
    G1 X265
    M400
    PROBE SAMPLES=3 SAMPLES_TOLERANCE=0.1 SAMPLES_TOLERANCE_RETRIES=3
    _TC_STORE VAR=zw SOURCE=probe
    G1 Z10 F1200
    _TC_CLEAN_HEAT TOOL={params.TOOL}

[gcode_macro _TC_CLEAN_HEAT]
gcode:
    {% set i = params.TOOL|int %}
    {% set heater = 'extruder' if i == 0 else 'extruder%d' % i %}
    {% set zw = printer['gcode_macro _TC_STATE'].zw %}
    G1 Z{zw + 8} F1200
    M400
    _TC_GRAB TOOL={i}
    G1 Z{zw + 8} F3000
    ACTIVATE_EXTRUDER EXTRUDER={heater}
    M104 T{i} S220
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM=217 MAXIMUM=223
    M83
    G1 E50 F300
    M400
    M106 P1 S153
    G1 E-5 F300
    M400
    G1 X250 F6000
    G1 Y13.8 F24000
    G1 X266.5 F6000
    G1 Z{zw + 1} F600
    M104 T{i} S120
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM=117 MAXIMUM=123
    G1 Z{zw + 8} F600
    M400
    M106 P1 S0

# KEY=<t0..t3> SX= SY=: Z touch on the station at zref, then two passes of
# four side touches; each pass centres XY and the second re-measures Z at
# the first centre (stock sub_7728F4). Saves <KEY>_x/y/z.
[gcode_macro _TC_MEASURE]
gcode:
    {% set s = printer['gcode_macro _TC_STATE'] %}
    SET_GCODE_VARIABLE MACRO=_TC_STATE VARIABLE=sx VALUE={params.SX|float}
    SET_GCODE_VARIABLE MACRO=_TC_STATE VARIABLE=sy VALUE={params.SY|float}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    M400
    G1 Z10 F1200
    G1 X{params.SX|float} Y{params.SY|float} F12000
    M400
    _TC_PROBE AXIS=Z TARGET={s.zref}
    _TC_STORE VAR=z
    _TC_CIRCLE
    _TC_REPROBE_Z
    _TC_CIRCLE
    _TC_SAVE KEY={params.KEY}

# ESTOP moves run at 100 mm/s^2 (stock estopManager).
[gcode_macro _TC_PROBE]
gcode:
    SET_VELOCITY_LIMIT ACCEL=100
    ENDSTOP_PROBE NAME=station AXIS={params.AXIS} TARGET={params.TARGET}
    SET_VELOCITY_LIMIT ACCEL={printer['gcode_macro _TC_STATE'].accel}

[gcode_macro _TC_CIRCLE]
gcode:
    {% set s = printer['gcode_macro _TC_STATE'] %}
    G1 X{s.sx} Y{s.sy} F1200
    G1 Z{s.z + 0.6} F1200
    _TC_POINT AXIS=X TARGET={s.sx + 14} VAR=x1
    _TC_POINT AXIS=Y TARGET={s.sy + 14} VAR=y2
    _TC_POINT AXIS=X TARGET={s.sx - 14} VAR=x3
    _TC_POINT AXIS=Y TARGET={s.sy - 14} VAR=y4
    _TC_CENTRE

[gcode_macro _TC_POINT]
gcode:
    {% set s = printer['gcode_macro _TC_STATE'] %}
    G1 Z{s.z + 0.6} F1200
    G1 X{s.sx} Y{s.sy} F1200
    M400
    _TC_PROBE AXIS={params.AXIS} TARGET={params.TARGET}
    _TC_STORE VAR={params.VAR}

# For four symmetric side touches the stock least-squares circle fit
# reduces to the midpoints.
[gcode_macro _TC_CENTRE]
gcode:
    {% set s = printer['gcode_macro _TC_STATE'] %}
    SET_GCODE_VARIABLE MACRO=_TC_STATE VARIABLE=sx VALUE={(s.x1 + s.x3) / 2}
    SET_GCODE_VARIABLE MACRO=_TC_STATE VARIABLE=sy VALUE={(s.y2 + s.y4) / 2}

[gcode_macro _TC_REPROBE_Z]
gcode:
    {% set s = printer['gcode_macro _TC_STATE'] %}
    G1 Z{s.z + 3} F1200
    G1 X{s.sx} Y{s.sy} F1200
    M400
    G1 Z10 F1200
    _TC_PROBE AXIS=Z TARGET=-3
    _TC_STORE VAR=z

[gcode_macro _TC_SAVE]
gcode:
    {% set s = printer['gcode_macro _TC_STATE'] %}
    {% set key = params.KEY %}
    G1 X{s.sx} Y{s.sy} F1200
    G1 Z10 F1200
    M400
    SAVE_VARIABLE VARIABLE={key}_x VALUE={'%.4f' % s.sx}
    SAVE_VARIABLE VARIABLE={key}_y VALUE={'%.4f' % s.sy}
    SAVE_VARIABLE VARIABLE={key}_z VALUE={'%.4f' % s.z}
    RESPOND MSG="{key}: X={'%.4f' % s.sx} Y={'%.4f' % s.sy} Z={'%.4f' % s.z}"
