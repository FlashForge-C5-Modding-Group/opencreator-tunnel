
# Original code: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging

[gcode_macro LINE_PURGE]
description: A purge macro that adapts to be near your actual printed objects
gcode:
    # Get relevant printer params
    {% set travel_speed = (printer.toolhead.max_velocity) * 30 | float %}
    {% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section | float %}
    
    # Use firmware retraction if it is defined
    {% if printer.firmware_retraction is defined %}
        {% set RETRACT = G10 | string %}
        {% set UNRETRACT = G11 | string %}
    {% else %}
        {% set RETRACT = 'G1 E-.5 F2100' | string %}
        {% set UNRETRACT = 'G1 E.5 F2100' | string %}
    {% endif %}

    # Get purge settings from _Kamp_Settings
    {% set verbose_enable = printer["gcode_macro _KAMP_Settings"].verbose_enable | abs %}
    {% set purge_height = printer["gcode_macro _KAMP_Settings"].purge_height | float %}
    {% set tip_distance = printer["gcode_macro _KAMP_Settings"].tip_distance | float %}
    {% set purge_margin = params.MARGIN | default(printer["gcode_macro _KAMP_Settings"].purge_margin) | float %}
    {% set purge_amount = printer["gcode_macro _KAMP_Settings"].purge_amount | float %}
    {% set flow_rate = printer["gcode_macro _KAMP_Settings"].flow_rate | float %}

    # The bed: from 0 (or a higher axis minimum) to the axis maximum
    {% set bed_x_min = [printer.toolhead.axis_minimum.x, 0] | max %}
    {% set bed_y_min = [printer.toolhead.axis_minimum.y, 0] | max %}
    {% set bed_x_max = printer.toolhead.axis_maximum.x %}
    {% set bed_y_max = printer.toolhead.axis_maximum.y %}
    {% set line_room = purge_amount + 10 %}                                                             # The line plus the move that breaks the string

    # Calculate purge origins and centers from objects
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}    # Get all object points
    {% set purge_x_min = (all_points | map(attribute=0) | min | default(0)) %}                          # Object x min
    {% set purge_x_max = (all_points | map(attribute=0) | max | default(0)) %}                          # Object x max
    {% set purge_y_min = (all_points | map(attribute=1) | min | default(0)) %}                          # Object y min
    {% set purge_y_max = (all_points | map(attribute=1) | max | default(0)) %}                          # Object y max

    # Where a line along X (front or back) or along Y (left or right) starts: centered on the objects, kept on the bed
    {% set purge_x_start = ([[((purge_x_max + purge_x_min) / 2) - (purge_amount / 2), bed_x_min] | max, bed_x_max - line_room] | min) %}
    {% set purge_y_start = ([[((purge_y_max + purge_y_min) / 2) - (purge_amount / 2), bed_y_min] | max, bed_y_max - line_room] | min) %}

    # The first side of the objects with room for the line purge_margin away: front, left, back, right.
    # Never closer: with no room on any side there is no line.
    {% if not all_points %}
        {% set side = 'corner' %}                                                                       # No object outlines: front left corner of the bed
        {% set purge_x = bed_x_min %}
        {% set purge_y = bed_y_min %}
    {% elif purge_y_min - purge_margin >= bed_y_min %}
        {% set side = 'front' %}
        {% set purge_x = purge_x_start %}
        {% set purge_y = purge_y_min - purge_margin %}
    {% elif purge_x_min - purge_margin >= bed_x_min %}
        {% set side = 'left' %}
        {% set purge_x = purge_x_min - purge_margin %}
        {% set purge_y = purge_y_start %}
    {% elif purge_y_max + purge_margin <= bed_y_max %}
        {% set side = 'back' %}
        {% set purge_x = purge_x_start %}
        {% set purge_y = purge_y_max + purge_margin %}
    {% elif purge_x_max + purge_margin <= bed_x_max %}
        {% set side = 'right' %}
        {% set purge_x = purge_x_max + purge_margin %}
        {% set purge_y = purge_y_start %}
    {% else %}
        {% set side = 'none' %}
    {% endif %}

    # Calculate purge speed
    {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}

    {% if cross_section < 5 %}

        {action_respond_info("[Extruder] max_extrude_cross_section is insufficient for purge, please set it to 5 or greater. Purge skipped.")}

    {% elif side == 'none' %}

        {action_respond_info("KAMP purge skipped: no room {}mm away from the objects on any side.".format(purge_margin))}

    {% else %}

        {% if verbose_enable == True %}

        {action_respond_info("Moving filament tip {}mms".format(                                                                 
            (tip_distance),                                                                                      
        )) }
        {% endif %}

        {% if printer.firmware_retraction is defined %}
            {action_respond_info("KAMP purge is using firmware retraction.")}
        {% else %}
            {action_respond_info("KAMP purge is not using firmware retraction, it is recommended to configure it.")}
        {% endif %}

        {action_respond_info("KAMP purge starting at {}, {} ({}) and purging {}mm of filament, requested flow rate is {}mm3/s.".format(                                                                 
            (purge_x),
            (purge_y),
            (side),
            (purge_amount),
            (flow_rate),
        )) }

        SAVE_GCODE_STATE NAME=Prepurge_State                                                    # Create gcode state

        G92 E0                                                                                  # Reset extruder
        G0 F{travel_speed}                                                                      # Set travel speed
        G90                                                                                     # Absolute positioning
        G0 X{purge_x} Y{purge_y}                                                                # Move to purge position
        G0 Z{purge_height}                                                                      # Move to purge Z height
        M83                                                                                     # Relative extrusion mode
        G1 E{tip_distance} F{purge_move_speed}                                                  # Move filament tip

        {% if side in ['front', 'back'] %}                                                      # In front of or behind the objects: line along X

            G1 X{purge_x + purge_amount} E{purge_amount} F{purge_move_speed}                    # Purge line
            {RETRACT}                                                                           # Retract
            G0 X{purge_x + purge_amount + 10} F{travel_speed}                                   # Rapid move to break string

        {% else %}                                                                              # Left or right of the objects: line along Y

            G1 Y{purge_y + purge_amount} E{purge_amount} F{purge_move_speed}                    # Purge line
            {RETRACT}                                                                           # Retract
            G0 Y{purge_y + purge_amount + 10} F{travel_speed}                                   # Rapid move to break string

        {% endif %}

        G92 E0                                                                                  # Reset extruder distance
        M82                                                                                     # Absolute extrusion mode
        G0 Z{purge_height * 2} F{travel_speed}                                                  # Z hop

        RESTORE_GCODE_STATE NAME=Prepurge_State                                                 # Restore gcode state
    
    {% endif %}
