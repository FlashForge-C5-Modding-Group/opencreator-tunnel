
# AFC owns the four tool-start presence switches. These separate wheel motion
# sensors detect failed filament movement. A wheel failure with filament still
# present is a clog; AFC handles actual runout and infinite-spool switching.

[filament_motion_sensor fm_ex0]
switch_pin: !eheaterboard:PA15
detection_length: 50
extruder: extruder
event_delay: 3.0
pause_on_runout: False
runout_gcode:
     C5_WHEEL_CLOG TOOL=0
insert_gcode:
     { action_respond_info("wheel insert:T0") }

[filament_motion_sensor fm_ex1]
switch_pin: !eheaterboard:PB13
detection_length: 50
extruder: extruder1
event_delay: 3.0
pause_on_runout: False
runout_gcode:
     C5_WHEEL_CLOG TOOL=1
insert_gcode:
     { action_respond_info("wheel insert:T1") }

[filament_motion_sensor fm_ex2]
switch_pin: !eheaterboard:PB11
detection_length: 50
extruder: extruder2
event_delay: 3.0
pause_on_runout: False
runout_gcode:
     C5_WHEEL_CLOG TOOL=2
insert_gcode:
     { action_respond_info("wheel insert:T2") }

[filament_motion_sensor fm_ex3]
switch_pin: !eheaterboard:PB12
detection_length: 50
extruder: extruder3
event_delay: 3.0
pause_on_runout: False
runout_gcode:
     C5_WHEEL_CLOG TOOL=3
insert_gcode:
     { action_respond_info("wheel insert:T3") }

# Standalone AFC tracks filament at each pin_tool_start; insertion into the
# tool is manual. This first phase selects and heats the requested tool.
[gcode_macro C5_PREPARE_FILAMENT_LOAD]
description: Select and heat a tool before manually inserting filament
gcode:
  {% set tool = params.TOOL|default(-1)|int %}
  {% set temp = params.TEMP|default(220)|float %}
  {% if tool < 0 or tool > 3 or temp < 150 or temp > 300 %}
    { action_raise_error("Use TOOL=0..3 and a safe TEMP=150..300") }
  {% endif %}
  {% if printer.print_stats.state == 'printing' %}
    { action_raise_error("Pause the print before loading filament") }
  {% endif %}
  {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
  {% if printer.pause_resume.is_paused %}
    C5_CHECK_LOAD_TOOL T={tool}
  {% else %}
    AFC_SELECT_TOOL TOOL={heater}
  {% endif %}
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp}
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={temp - 2}
  C5_FILAMENT_LOAD_READY

[gcode_macro C5_FILAMENT_LOAD_READY]
description: Report that a tool is hot and ready for manual filament insertion
gcode:
  { action_respond_info("Tool is hot. Insert filament until AFC detects it, then run C5_LOAD_FILAMENT LENGTH=20 to purge over the bucket, cool, and dock.") }

[gcode_macro C5_LOAD_FILAMENT]
description: Load the attached tool, TOOL=n, or TOOLS=0,2,3
gcode:
  {% set length = params.LENGTH|default(80)|float %}
  {% if length <= 0 or length > 200 %}
    { action_raise_error("LENGTH must be greater than 0 and at most 200 mm") }
  {% endif %}
  {% if 'TOOL' in params and 'TOOLS' in params %}
    { action_raise_error("Use TOOL=n or TOOLS=0,2,..., not both") }
  {% endif %}
  {% if 'TOOL' in params or 'TOOLS' in params %}
    {% if printer.print_stats.state in ['printing', 'paused'] or printer.pause_resume.is_paused %}
      { action_raise_error("Finish or cancel the print before loading selected tools") }
    {% endif %}
    {% set tools_arg = params.TOOLS if 'TOOLS' in params else params.TOOL %}
    {% set selected = namespace(indices=[]) %}
    {% for raw in tools_arg.split(',') %}
      {% set index = raw|trim %}
      {% if index not in ['0', '1', '2', '3'] %}
        { action_raise_error("TOOLS must be a comma-separated list of 0..3") }
      {% endif %}
      {% if index|int not in selected.indices %}
        {% set selected.indices = selected.indices + [index|int] %}
      {% endif %}
    {% endfor %}
    {% set toolchanger = printer.creator5_toolchanger %}
    {% if toolchanger.sensor_error %}
      { action_raise_error("Tool mount sensors invalid: " ~ toolchanger.sensor_error) }
    {% endif %}
    {% set mounted = toolchanger.active_tool %}
    {% if mounted is not none and mounted not in selected.indices %}
      { action_raise_error("T" ~ mounted ~ " is mounted but not requested; cool and dock it before loading other tools") }
    {% endif %}
    {% for index in selected.indices %}
      {% set temp = params['TEMP' ~ index]|default(params.TEMP|default(220))|float %}
      {% if temp < 150 or temp > 300 %}
        { action_raise_error("T" ~ index ~ " TEMP must be between 150 and 300 C") }
      {% endif %}
    {% endfor %}
    {% if mounted is not none %}
      {% set mounted_temp = params['TEMP' ~ mounted]|default(params.TEMP|default(220))|float %}
      C5_LOAD_SELECTED_TOOL TOOL={mounted} TEMP={mounted_temp} LENGTH={length}
    {% endif %}
    {% for index in selected.indices %}
      {% if index != mounted %}
        {% set temp = params['TEMP' ~ index]|default(params.TEMP|default(220))|float %}
        C5_LOAD_SELECTED_TOOL TOOL={index} TEMP={temp} LENGTH={length}
      {% endif %}
    {% endfor %}
  {% else %}
    C5_LOAD_ATTACHED_FILAMENT LENGTH={length}
  {% endif %}

[gcode_macro C5_LOAD_SELECTED_TOOL]
description: Select and heat one requested tool, then purge, cool, and dock
gcode:
  {% set tool = params.TOOL|int %}
  {% set temp = params.TEMP|float %}
  {% if tool < 0 or tool > 3 or temp < 150 or temp > 300 %}
    { action_raise_error("Use TOOL=0..3 and a safe TEMP=150..300") }
  {% endif %}
  {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
  AFC_SELECT_TOOL TOOL={heater}
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp}
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={temp - 2}
  C5_LOAD_ATTACHED_FILAMENT LENGTH={params.LENGTH|float}

[gcode_macro C5_LOAD_ATTACHED_FILAMENT]
description: Load the hot, physically attached tool
gcode:
  {% set length = params.LENGTH|default(20)|float %}
  {% set heater = printer.toolhead.extruder %}
  {% set hotend = printer[heater].target|float if heater in ['extruder', 'extruder1', 'extruder2', 'extruder3'] else 0 %}
  {% if hotend <= 0 and heater in ['extruder', 'extruder1', 'extruder2', 'extruder3'] %}
    {% set hotend = printer[heater].temperature|float %}
  {% endif %}
  {% if length <= 0 or length > 80 %}
    { action_raise_error("LENGTH must be greater than 0 and at most 80 mm") }
  {% endif %}
  {% if heater not in ['extruder', 'extruder1', 'extruder2', 'extruder3'] %}
    { action_raise_error("Select a Creator 5 AFC tool before loading") }
  {% endif %}
  {% if printer.print_stats.state == 'printing' %}
    { action_raise_error("Pause the print before feeding filament") }
  {% endif %}
  {% if not printer[heater].can_extrude %}
    { action_raise_error("Heat the selected tool before feeding filament") }
  {% endif %}
  C5_CHECK_LOAD_TOOL
  {% if printer.pause_resume.is_paused %}
    # Feed in place: do not move across the print or replace PAUSE's saved state.
    SAVE_GCODE_STATE NAME=C5_PAUSED_LOAD
    M83
    G1 E{length} F180
    RESTORE_GCODE_STATE NAME=C5_PAUSED_LOAD MOVE=0
  {% else %}
    # Bucket purge and wiper cooldown require the measured nozzle Z offset.
    {% set tool = 0 if heater == 'extruder' else heater[-1]|int %}
    C5_AUTO_NOZZLE_Z T={tool} HOTEND={hotend} BED={printer.heater_bed.target|float} FIRST_LAYER_HEIGHT=0.2
    C5_TOOL_PURGE LENGTH={length}
    C5_COOL_FOR_DOCK HOTEND={hotend}
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET=0
    AFC_UNSELECT_TOOL
  {% endif %}

[gcode_macro C5_PREPARE_LOAD_T0]
description: Select and heat T0 for manual filament insertion
gcode:
  C5_PREPARE_FILAMENT_LOAD TOOL=0 TEMP={params.TEMP|default(220)|float}

[gcode_macro C5_PREPARE_LOAD_T1]
description: Select and heat T1 for manual filament insertion
gcode:
  C5_PREPARE_FILAMENT_LOAD TOOL=1 TEMP={params.TEMP|default(220)|float}

[gcode_macro C5_PREPARE_LOAD_T2]
description: Select and heat T2 for manual filament insertion
gcode:
  C5_PREPARE_FILAMENT_LOAD TOOL=2 TEMP={params.TEMP|default(220)|float}

[gcode_macro C5_PREPARE_LOAD_T3]
description: Select and heat T3 for manual filament insertion
gcode:
  C5_PREPARE_FILAMENT_LOAD TOOL=3 TEMP={params.TEMP|default(220)|float}
