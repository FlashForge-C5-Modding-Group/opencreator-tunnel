# some macro

[gcode_macro C5_PID_CALIBRATE]
description: PID-calibrate one tool (T=0..3) or all of them (default). TARGET sets the shared target temp (default 210); T0=/T1=/T2=/T3= override it per tool. Picks up each tool before calibrating and saves once at the end.
gcode:
  {% set requested = params.TOOL|default('ALL')|upper %}
  {% set default_target = params.TARGET|default(210)|float %}
  {% set save = params.SAVE|default(1)|int %}
  {% if requested not in ['ALL', '0', '1', '2', '3'] %}
    { action_raise_error("Specify TOOL=0..3 or TOOL=ALL") }
  {% endif %}
  {% if save not in [0, 1] %}
    { action_raise_error("SAVE must be 0 or 1") }
  {% endif %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
    G28
  {% endif %}
  {% set tools = [0, 1, 2, 3] if requested == 'ALL' else [requested|int] %}
  {% for tool in tools %}
    T{tool}
    {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
    {% set target = params['T' ~ tool]|default(default_target)|float %}
    PID_CALIBRATE HEATER={heater} TARGET={target}
  {% endfor %}
  AFC_UNSELECT_TOOL
  {% if save %}
    SAVE_CONFIG
  {% endif %}

[gcode_macro M900]
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[gcode_macro M106]
gcode:
  {% if 'S' in params %}
    {% set speed = params['S']|float %}
  {% else %}
    {% set speed = 255.0|float%}
  {% endif %}
  {% if 'T' in params %}
    {% set index = params['T']|int %}
  {% endif %}
  {% if 'P' in params %}
    {% set index = params['P']|int %}
  {% endif %}
  {% if index == 101 %}
      #SET_FAN_SPEED FAN=internal_fan SPEED={speed/255.0}
  {% elif index == 2 %}
      SET_FAN_SPEED FAN=chamber_loop_fan SPEED={speed/255.0}
      {% if printer['heater_generic chamber_heater'].target|float > 0 %}
        { action_respond_info("Chamber heater is on; chamber cooling fan left off") }
      {% else %}
        SET_FAN_SPEED FAN=chamber_cool_fan SPEED={speed/255.0}
      {% endif %}
  {% elif index == 3 %}
      SET_FAN_SPEED FAN=chamber_fan SPEED={speed/255.0}
  {% else %}
      SET_FAN_SPEED FAN=fanM106 SPEED={speed/255.0}
  {% endif %}

[gcode_macro M107]
gcode:
  {% if 'T' in params %}
    {% set index = params['T']|int %}
  {% endif %}
  {% if 'P' in params %}
    {% set index = params['P']|int %}
  {% endif %}
  {% if index == 101 %}
      #SET_FAN_SPEED FAN=internal_fan SPEED={0.0}
  {% elif index == 2 %}
      SET_FAN_SPEED FAN=chamber_loop_fan SPEED={0.0}
      SET_FAN_SPEED FAN=chamber_cool_fan SPEED={0.0}
  {% elif index == 3 %}
      SET_FAN_SPEED FAN=chamber_fan SPEED={0.0}
  {% else %}
      SET_FAN_SPEED FAN=fanM106 SPEED={0.0}
  {% endif %}

[gcode_macro M191]
description: Set (and, unless Misc Chamber Wait is off, wait for) the chamber temperature
gcode:
  {% set wait = printer["output_pin chamber_wait"].value %}
  {% if 'S' in params %}
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={params.S}
    {% if wait %}
      TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={params.S}
    {% endif %}
  {% elif 'R' in params %}
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={params.R}
    {% if wait %}
      TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={params.R|float - 2} MAXIMUM={params.R|float + 2}
    {% endif %}
  {% endif %}

[gcode_macro CALIBRATE_INPUT_SHAPER]
description: Run input shaper resonance test for both axes with toolhead attached, and save config
gcode:
	G28 X Y
	AFC_UNSELECT_TOOL
	G28
	T0
    SHAPER_CALIBRATE
	AFC_UNSELECT_TOOL

    # Save the configuration automatically
    SAVE_CONFIG

[gcode_macro DOCK_EXISTING_TOOL]
description: Dock currently attached tool using AFC_UNSELECT_TOOL, requires XY to be enabled
gcode:
	AFC_UNSELECT_TOOL

[gcode_macro FAST_TEST_256]
description: Rapid multi-axis stress test for 256x256 bed dimensions
gcode:
    # --- Default Parameters ---
    {% set SPEED = params.SPEED|default(300)|int * 60 %}         # Velocity in mm/s (converted to mm/min)
    {% set ACCEL = params.ACCEL|default(5000)|int %}             # Acceleration in mm/s²
    {% set ITERATIONS = params.ITERATIONS|default(5)|int %}      # Number of complete test loops
    {% set BOUND = params.BOUND|default(20)|int %}               # Margin in mm from axis edges (default 20mm -> 20..236)
    
    # Target 256x256 coordinates with boundary applied
    {% set min_x = BOUND %}
    {% set max_x = 256 - BOUND %}
    {% set min_y = BOUND %}
    {% set max_y = 256 - BOUND %}
    {% set center_x = 128 %}
    {% set center_y = 128 %}

    # Save current G-code state & limits
    SAVE_GCODE_STATE NAME=fast_test_state
    
    # Override acceleration limits
    SET_VELOCITY_LIMIT ACCEL={ACCEL} ACCEL_TO_DECEL={ACCEL / 2}
    
    # Home all axes if not homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    G90 ; Absolute positioning
    
    # Raise Z safely and travel to center
    G1 Z50 F3000
    G1 X{center_x} Y{center_y} F{SPEED}
    
    M118 Starting 256x256 Motion Test ({ITERATIONS} cycles at {SPEED / 60} mm/s, {ACCEL} mm/s²)...

    {% for i in range(ITERATIONS) %}
        # 1. Full Diagonals
        G1 X{min_x} Y{min_y} F{SPEED}
        G1 X{max_x} Y{max_y} F{SPEED}
        G1 X{min_x} Y{max_y} F{SPEED}
        G1 X{max_x} Y{min_y} F{SPEED}
        
        # 2. Perimeter Box
        G1 X{min_x} Y{min_y} F{SPEED}
        G1 X{max_x} Y{min_y} F{SPEED}
        G1 X{max_x} Y{max_y} F{SPEED}
        G1 X{min_x} Y{max_y} F{SPEED}
        
        # 3. High-Frequency Center Shakes (+/- 20mm rapid toggles)
        G1 X{center_x - 20} Y{center_y} F{SPEED}
        G1 X{center_x + 20} Y{center_y} F{SPEED}
        G1 X{center_x} Y{center_y - 20} F{SPEED}
        G1 X{center_x} Y{center_y + 20} F{SPEED}
    {% endfor %}

    # Return to center position
    G1 X{center_x} Y{center_y} F{SPEED}
    
    # Restore original system limits and state
    RESTORE_GCODE_STATE NAME=fast_test_state
    M118 256x256 Fast Motion Test Complete.
