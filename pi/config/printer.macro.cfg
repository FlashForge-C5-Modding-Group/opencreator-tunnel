# some macro

[gcode_macro C5_PID_CALIBRATE]
description: PID-calibrate one tool (T=0..3) or all of them (default). TARGET sets the shared target temp (default 250); T0=/T1=/T2=/T3= override it per tool. TOLERANCE is how closely the autotune cycles must agree (default 0.05; Kalico gives up after about 30 cycles). Picks up each tool before calibrating and saves once at the end.
gcode:
  {% set requested = params.TOOL|default('ALL')|upper %}
  {% set default_target = params.TARGET|default(250)|float %}
  {% set save = params.SAVE|default(1)|int %}
  {% set tolerance = params.TOLERANCE|default(0.05)|float %}
  {% if requested not in ['ALL', '0', '1', '2', '3'] %}
    { action_raise_error("Specify TOOL=0..3 or TOOL=ALL") }
  {% endif %}
  {% if save not in [0, 1] %}
    { action_raise_error("SAVE must be 0 or 1") }
  {% endif %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
    G28
  {% endif %}
  {% set tools = [0, 1, 2, 3] if requested == 'ALL' else [requested|int] %}
  {% set tc = printer.configfile.settings.creator5_toolchanger|default({}) %}
  {% set bucket_exit_x = tc.prep_approach_x|default(250.0) %}
  {% set bucket_exit_y = tc.prep_approach_y|default(250.0) %}
  {% for tool in tools %}
    T{tool}
    # Calibrate over the purge bucket so ooze does not land on the bed.
    C5_MOVE_TO_PURGE_BUCKET
    {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
    {% set target = params['T' ~ tool]|default(default_target)|float %}
    PID_CALIBRATE HEATER={heater} TARGET={target} TOLERANCE={tolerance}
    # Leave the bucket through the inboard waypoint before docking.
    G90
    G1 X{bucket_exit_x} Y{bucket_exit_y} F6000
  {% endfor %}
  AFC_UNSELECT_TOOL
  {% if save %}
    SAVE_CONFIG
  {% endif %}

[gcode_macro M900]
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[gcode_macro M106]
gcode:
  {% if 'S' in params %}
    {% set speed = params['S']|float %}
  {% else %}
    {% set speed = 255.0|float%}
  {% endif %}
  {% if 'T' in params %}
    {% set index = params['T']|int %}
  {% endif %}
  {% if 'P' in params %}
    {% set index = params['P']|int %}
  {% endif %}
  {% if index == 101 %}
      #SET_FAN_SPEED FAN=internal_fan SPEED={speed/255.0}
  {% elif index in [2, 3] and 'fan_generic chamber_fan' not in printer %}
      # Creator 5: no chamber or aux fans (printer.pro.cfg is Pro only)
  {% elif index == 2 %}
      SET_FAN_SPEED FAN=chamber_loop_fan SPEED={speed/255.0}
      {% if printer['heater_generic chamber_heater'].target|float > 0 %}
        { action_respond_info("Chamber heater is on; chamber cooling fan left off") }
      {% else %}
        SET_FAN_SPEED FAN=chamber_cool_fan SPEED={speed/255.0}
      {% endif %}
  {% elif index == 3 %}
      SET_FAN_SPEED FAN=chamber_fan SPEED={speed/255.0}
  {% else %}
      SET_FAN_SPEED FAN=fanM106 SPEED={speed/255.0}
  {% endif %}

[gcode_macro M107]
gcode:
  {% if 'T' in params %}
    {% set index = params['T']|int %}
  {% endif %}
  {% if 'P' in params %}
    {% set index = params['P']|int %}
  {% endif %}
  {% if index == 101 %}
      #SET_FAN_SPEED FAN=internal_fan SPEED={0.0}
  {% elif index in [2, 3] and 'fan_generic chamber_fan' not in printer %}
      # Creator 5: no chamber or aux fans (printer.pro.cfg is Pro only)
  {% elif index == 2 %}
      SET_FAN_SPEED FAN=chamber_loop_fan SPEED={0.0}
      SET_FAN_SPEED FAN=chamber_cool_fan SPEED={0.0}
  {% elif index == 3 %}
