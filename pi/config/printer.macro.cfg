  {% else %}
      SET_FAN_SPEED FAN=fanM106 SPEED={0.0}
  {% endif %}

[gcode_macro M191]
description: Set (and, unless Misc Chamber Wait is off, wait for) the chamber temperature
gcode:
  {% set wait = printer["output_pin chamber_wait"].value %}
  {% if 'heater_generic chamber_heater' not in printer %}
    {% if params.S|default(params.R|default(0))|float > 0 %}
      { action_respond_info("No chamber heater on a Creator 5; M191 ignored") }
    {% endif %}
  {% elif 'S' in params %}
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={params.S}
    {% if wait %}
      TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={params.S}
    {% endif %}
  {% elif 'R' in params %}
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={params.R}
    {% if wait %}
      TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={params.R|float - 2} MAXIMUM={params.R|float + 2}
    {% endif %}
  {% endif %}

[gcode_macro CALIBRATE_INPUT_SHAPER]
description: Run input shaper resonance test for both axes with toolhead attached, and save config (SAVE=0 to leave saving for later)
gcode:
	G28
	T0
    SHAPER_CALIBRATE
	AFC_UNSELECT_TOOL

    # Save the configuration automatically
    {% if params.SAVE|default(1)|int %}
      SAVE_CONFIG
    {% endif %}

[gcode_macro CALIBRATE_INPUT_SHAPER_GRAPH]
description: Same as CALIBRATE_INPUT_SHAPER, and draws a graph of each axis to config/input_shaper/ (SAVE=0 to leave saving for later)
gcode:
  G28
  T0
  SHAPER_CALIBRATE NAME=oc
  AFC_UNSELECT_TOOL
  _OC_SHAPER_GRAPH
  {% if params.SAVE|default(1)|int %}
    SAVE_CONFIG
  {% endif %}

# Run after SHAPER_CALIBRATE: its recommendation is read from the pending
# SAVE_CONFIG items, which only exist once it has finished.
[gcode_macro _OC_SHAPER_GRAPH]
gcode:
  {% set pending = printer.configfile.save_config_pending_items.input_shaper|default({}) %}
  {% for axis in ['x', 'y'] %}
    RUN_SHELL_COMMAND CMD=oc_shaper_graph PARAMS="/tmp/calibration_data_{axis}_oc.csv --axis {axis} --shaper '{pending['shaper_type_' ~ axis]|default('')}' --freq {pending['shaper_freq_' ~ axis]|default(0)} --scv {printer.toolhead.square_corner_velocity}"
  {% endfor %}
  RESPOND MSG="Input shaper graphs are in the config folder, under input_shaper/"

[gcode_shell_command oc_shaper_graph]
command: $HOME/klippy-env/bin/python $HOME/opencreator-tunnel/pi/moonraker/shaper_graph.py --klippy $HOME/klipper/klippy --out-dir $HOME/printer_data/config/input_shaper
timeout: 180
verbose: True

[gcode_macro DOCK_EXISTING_TOOL]
description: Dock currently attached tool using AFC_UNSELECT_TOOL, requires XY to be enabled
gcode:
	AFC_UNSELECT_TOOL

[gcode_macro FAST_TEST_256]
description: Rapid multi-axis stress test for 256x256 bed dimensions
gcode:
    # --- Default Parameters ---
    {% set SPEED = params.SPEED|default(300)|int * 60 %}         # Velocity in mm/s (converted to mm/min)
    {% set ACCEL = params.ACCEL|default(5000)|int %}             # Acceleration in mm/s²
    {% set ITERATIONS = params.ITERATIONS|default(5)|int %}      # Number of complete test loops
    {% set BOUND = params.BOUND|default(20)|int %}               # Margin in mm from axis edges (default 20mm -> 20..236)
    
    # Target 256x256 coordinates with boundary applied
    {% set min_x = BOUND %}
    {% set max_x = 256 - BOUND %}
    {% set min_y = BOUND %}
    {% set max_y = 256 - BOUND %}
    {% set center_x = 128 %}
    {% set center_y = 128 %}

    # Save current G-code state & limits
    SAVE_GCODE_STATE NAME=fast_test_state
    
    # Override acceleration limits
    SET_VELOCITY_LIMIT ACCEL={ACCEL} ACCEL_TO_DECEL={ACCEL / 2}
    
    # Home all axes if not homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    G90 ; Absolute positioning
    
    # Raise Z safely and travel to center
    G1 Z50 F3000
    G1 X{center_x} Y{center_y} F{SPEED}
    
    M118 Starting 256x256 Motion Test ({ITERATIONS} cycles at {SPEED / 60} mm/s, {ACCEL} mm/s²)...

    {% for i in range(ITERATIONS) %}
        # 1. Full Diagonals
        G1 X{min_x} Y{min_y} F{SPEED}
        G1 X{max_x} Y{max_y} F{SPEED}
        G1 X{min_x} Y{max_y} F{SPEED}
        G1 X{max_x} Y{min_y} F{SPEED}
        
        # 2. Perimeter Box
        G1 X{min_x} Y{min_y} F{SPEED}
        G1 X{max_x} Y{min_y} F{SPEED}
        G1 X{max_x} Y{max_y} F{SPEED}
        G1 X{min_x} Y{max_y} F{SPEED}
        
        # 3. High-Frequency Center Shakes (+/- 20mm rapid toggles)
        G1 X{center_x - 20} Y{center_y} F{SPEED}
        G1 X{center_x + 20} Y{center_y} F{SPEED}
        G1 X{center_x} Y{center_y - 20} F{SPEED}
        G1 X{center_x} Y{center_y + 20} F{SPEED}
    {% endfor %}

    # Return to center position
    G1 X{center_x} Y{center_y} F{SPEED}
    
    # Restore original system limits and state
    RESTORE_GCODE_STATE NAME=fast_test_state
    M118 256x256 Fast Motion Test Complete.

[gcode_macro C5_NOZZLE_WIPE_TEST]
description: Wipe the attached nozzle on the front wiper, lift, then cool it (HOTEND=220)
gcode:
  {% set tc = printer.creator5_toolchanger %}
  {% if tc.active_tool is none %}
    { action_raise_error("C5_NOZZLE_WIPE_TEST needs an attached tool") }
  {% endif %}
  {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
    { action_raise_error("Home XYZ before C5_NOZZLE_WIPE_TEST") }
  {% endif %}
  {% set tool = tc.active_tool %}
  {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
  {% set hotend = params.HOTEND|default(printer[heater].target)|float %}
  {% set x = 264.0 %}
  {% set y = 2.0 %}
  {% set wipe_z = 2.462 %}
  # Never more than 10 mm -X of the start while lowered: further breaks the nozzle.
  {% set wipe_x = [[params.WIPE_X|default(10)|float, 0.0]|max, 10.0]|min %}
  C5_VERIFY_NOZZLE_Z
  SAVE_GCODE_STATE NAME=C5_NOZZLE_WIPE
  G90
  G1 Z{[printer.gcode_move.gcode_position.z, 10.0]|max} F600
  G1 X250 Y250 F6000
  G1 Y{y} F6000
  G1 X{x} F3000
  G1 Z{wipe_z} F600
  G1 X{x + wipe_x} F3000
  G1 X{x} F3000
  G1 Z{wipe_z + 10.0} F600
  M400
  {% if hotend > 0 %}
    SET_FAN_SPEED FAN=fanM106 SPEED=0.6
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={[hotend - 100.0, 0.0]|max}
    TEMPERATURE_WAIT SENSOR={heater} MAXIMUM={[hotend - 100.0, 0.0]|max + 3.0}
    SET_FAN_SPEED FAN=fanM106 SPEED=0
  {% endif %}
  RESTORE_GCODE_STATE NAME=C5_NOZZLE_WIPE MOVE=0

# Pop-up menus for the touchscreen (GrumpyScreen Console -> Macros) and the web
# UIs. They use Klipper's action:prompt dialogs, so Fluidd and Mainsail show the
# same menus. Each menu only opens a dialog; the work is done by the existing
# OpenCreator macros its buttons run.

# Shared: close whatever dialog is open.
[gcode_macro _MENU_CLOSE]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"

# Shared: close the dialog, then run CMD.
[gcode_macro _MENU_RUN]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {params.CMD}

# Shared: not homed. Offer to home, then reopen the menu that asked
# (MENU=name; TEMP is passed back to LOAD_MENU).
[gcode_macro _MENU_NEED_HOME]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Not homed"
  RESPOND TYPE=command MSG="action:prompt_text The printer needs homing first. Home now? The menu opens again afterwards."
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_MENU_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_footer_button Home|_MENU_HOME_THEN MENU={params.MENU}{% if 'TEMP' in params %} TEMP={params.TEMP}{% endif %}|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _MENU_HOME_THEN]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  G28
  {params.MENU}{% if 'TEMP' in params %} TEMP={params.TEMP}{% endif %}

# ---------------------------------------------------------------------------
# Load filament and dock position: pick a tool.
# ---------------------------------------------------------------------------
[gcode_macro LOAD_MENU]
description: Pick a tool to load filament (TEMP=hotend temperature, default 220)
gcode:
  {% set temp = params.TEMP|default(220)|int %}
  {% set ha = printer.toolhead.homed_axes %}
  {% if "x" not in ha or "y" not in ha %}
    _MENU_NEED_HOME MENU=LOAD_MENU TEMP={temp}
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Load filament"
  RESPOND TYPE=command MSG="action:prompt_text Insert filament into the tool, then tap it."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for t in range(4) %}
    RESPOND TYPE=command MSG="action:prompt_button T{t}|_LOAD_PICK T={t} TEMP={temp}|primary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_MENU_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro CAL_DOCK_MENU]
description: Pick a tool for dock position calibration
gcode:
  {% set ha = printer.toolhead.homed_axes %}
  {% if "x" not in ha or "y" not in ha %}
    _MENU_NEED_HOME MENU=CAL_DOCK_MENU
  {% else %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Dock position calibration"
  RESPOND TYPE=command MSG="action:prompt_text Tools docked and cool. Pick the tool to calibrate."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for t in range(4) %}
    RESPOND TYPE=command MSG="action:prompt_button T{t}|_CAL_DOCK_PICK T={t}|primary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_MENU_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _LOAD_PICK]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  C5_LOAD_FILAMENT TOOL={params.T|int} TEMP={params.TEMP|default(220)|int}

[gcode_macro _CAL_DOCK_PICK]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  C5_CALIBRATE_TOOL_POSITION T={params.T|int}

# Tool offsets: OC's offset wizard (C5_CALIBRATE_OFFSETS with no parameters),
# after homing if needed.
[gcode_macro TOOL_OFFSETS_MENU]
description: Tool offset calibration wizard, homing first if needed
gcode:
  {% if printer.print_stats.state in ['printing', 'paused'] %}
