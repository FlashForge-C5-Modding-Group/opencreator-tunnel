# Creator 5: AFC standalone toolchanger only.  Physical tool motion, purge,
# filament loading, and safety checks are handled by the Creator 5 macros.
# Do not include AFC's BoxTurtle/feeder hardware or example macro configs.
[AFC]
VarFile: /home/cart/printer_data/config/AFC/AFC.var
moonraker_host: http://127.0.0.1
moonraker_port: 7125
enable_sensors_in_gui: True
# Keep AFC's T0-T3 commands, but do not inject its unused macro buttons or
# virtual feeder quiet-mode switch into the Mainsail object list.
show_macros: False
show_quiet_mode: False
# Creator 5 has no TD-1 reader or AFC feeder spools. Disable the periodic
# device probe and virtual-lane weight timer, but retain physical runout pins.
enable_td1_detection: False
track_filament_weight: False
enable_print_metadata: True

# Standalone tools have no AFC feeder, hub, buffer, cutter, or brush.
load_to_hub: False
assisted_unload: False
tool_cut: False
park: False
poop: False
kick: False
wipe: False
form_tip: False
enable_standalone_purge: False

# Creator 5's C5_TOOL_SELECT/C5_TOOL_DOCK handle clearance and docking.
z_hop: 0
# Return to the saved print XY at rated travel speed; final Z remains slow.
resume_speed: 600
resume_z_speed: 20

[AFC_prep]
# PREP registers T0-T3 and synchronizes AFC's state after Klippys.
# The standalone Toolchanger unit's PREP test does not move hardware.
enable: False
# Keep the Creator 5's own manual filament-loading commands intact.
disable_unload_filament_remapping: True

[delayed_gcode afc_welcome]
initial_duration: 2
gcode:
  PREP
