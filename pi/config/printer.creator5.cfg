[creator5_toolchanger]
door_buttons: topDoor, frontDoor
safe_z: 10
# After levelboard tool-offset measurement, clear the target before docking.
offset_calibration_lift: 3
offset_calibration_lift_speed: 10
# Toolchange travel profile requested for this machine; contact moves retain
# their separate lower speeds below.
pickup_accel: 30000
# Toolchange moves are short; without this they never reach full speed
# under the printer's minimum_cruise_ratio (0.5).
pickup_minimum_cruise_ratio: 0
clear_travel_speed: 600
clearance_z_speed: 60
dock_approach_speed: 90
# Dock's own approach_x->dock leg used to run entirely at dock_approach_speed
# (90mm/s), even though only the final ~10-20mm near the dock actually needs
# to be slow/contact-sensitive. Stage the rest of that leg at clear_travel_speed
# instead (matching how pickup already stages via pre_dock_x).
dock_predock_offset: 12
pickup_predock_speed: 600
pickup_latch_speed: 90
pullback_speed: 160
# Keep the full 20 mm latch-clearance travel, but avoid the apparent pause
# caused by traversing that segment at only 80 mm/s. The remainder of the
# pullback uses clear_travel_speed before sensor verification/activation.
pullback_slow_distance: 20
departure_speed: 600
pickup_departure_speed: 600
# Reinstate full rated travel acceleration after a successful pickup so the
# first move toward the print does not inherit a lower prior limit.
post_select_accel: 30000
# No fixed toolchange pauses: motor motion and M400 still synchronize where
# required, and the physical dock/grab switches remain authoritative.
release_latch_wait_ms: 0
pickup_latch_wait_ms: 0
# Hit a transient "Conflicting dock/grab sensors" error with this at 0 (the
# stock value) -- when sensor state is read immediately after M400 rather
# than given a brief moment to settle, a tool mid-release/mid-latch can
# momentarily read both switches the same way. 50ms is negligible next to
# a multi-second toolchange but gives sensor delivery room to catch up.
toolchange_sensor_settle_ms: 50
approach_x: 250
pre_dock_x: 286
pullback: 60
max_mount_correction: 2
max_offset_correction: 3
# Extruder Position Calibrate: manual alignment timeout, hand-release pause,
# and reduced acceleration for the automatic endstop measurements.
position_calibration_timeout: 30 # In seconds
position_calibration_release_wait_ms: 5000
position_calibration_accel: 5000

t0_dock_x: 298.219
t0_dock_y: 56.472
t1_dock_x: 298.605
t1_dock_y: 107.100
t2_dock_x: 298.200
t2_dock_y: 156.920
t3_dock_x: 298.238
t3_dock_y: 207.140

# Factory initial calibration measurements, not printer G-code offsets.
t0_measure_x: 15.800
t0_measure_y: 215.280
t0_measure_z: 1.460
t1_measure_x: 15.820
t1_measure_y: 215.280
t1_measure_z: 1.467
t2_measure_x: 15.550
t2_measure_y: 216.085
t2_measure_z: 1.406
t3_measure_x: 15.864
t3_measure_y: 215.340
t3_measure_z: 1.437

# Levelboard circular calibration target (factory extruder config).
station_x: 28.815
station_y: 215.097
tool_fixture_shift_x: -12.5
scan_span: 10
# Independent levelboard scan reaches, in millimetres from the center.
scan_x_plus: 10
scan_y_plus: 10
scan_x_minus: 10
scan_y_minus: 10
# Set only after measuring the fixture height on this printer.
# scan_height: 1.7
# Optional XY-only scan height override. Full calibration probes Z first and
# scans XY 0.6 mm above each measured contact height, as in stock firmware.
z_probe_target: -8
# Stock touchscreen checkPlatformRemove() uses the ordinary [probe] pin at
# X43/Y226 and test.json cylinder_x/y before levelboard offset measurement.
plate_check_x: 43
plate_check_y: 226
plate_check_min_delta: 0.8
# XY travel speed (mm/s) between the build plate check probe points.
plate_check_travel_speed: 100
# Transcribed from the printer's own /usr/data/firmwareRes/config/*.json
# (factory calibration fixtures); copied alongside this config since the
# tunneled host has no access to the printer's filesystem.
extruder_json_path: ~/printer_data/config/firmwareRes/extruder.json
zoffset_json_path: ~/printer_data/config/firmwareRes/zoffset.json
test_json_path: ~/printer_data/config/firmwareRes/test.json

# Rear-right bucket; approach it from X250/Y250 to clear the docks.
# X276.5 keeps the 4.5 mm flow sweep inside the usable X280 boundary
# (X274.25-278.75), away from the chute's inboard wiper area.
prep_approach_x: 250
prep_approach_y: 250
purge_x: 276.5
# T3 has the largest nozzle Y-offset of the four tools (216.229 vs T0's
# 213.899, a 2.33mm difference); the toolchanger adjusts the purge target
# by each tool's offset relative to the reference tool, so purge_y: 260
# pushed T3's actual move to Y262.33, past stepper_y's position_max: 260.0
# ("Move out of range"). Backed off by 3mm (with margin) so every tool,
# including T3, stays within the configured travel limit.
purge_y: 257
# Hard stop for the flow sweep, 1 mm short of the usable X280 edge.
purge_max_x: 279
purge_z: 8.0
# After purging, return via X250/Y250 before front cooldown and docking.
cooldown_x: 266.5
cooldown_y: 13.8
cooldown_wipe_z: 1.7
cooldown_lift_z: 10.0
cooldown_fan_speed: 0.6
purge_length: 50
purge_speed: 3
flow_test_z: 8.0
# Sweep 0.5 mm less along X than the previous 5 mm flow sequence.
flow_sweep_x: 4.5
# Stock flow-test XY speeds (mm/s) and acceleration. The XY steppers are
# held, not stepped, during the test, so the carriage stays over the bucket.
flow_test_accel: 5000
flow_slow_speed: 18
flow_fast_speed: 183
flow_verdict_settle_ms: 50
flow_calibration_default: True
purge_default: True
bed_leveling_default: True
# Wait this many minutes at bed temperature immediately before a fresh mesh.
# Enable/disable with C5_MISC_BED_SOAK_ON / C5_MISC_BED_SOAK_OFF.
bed_soak_minutes: 2
bed_soak_default: False
# Mirrors firmwareExe's plugCheck/Clog Detection setting. Toggle in Misc.
clog_detection_default: False
# Misc switch: lower the bed to physical Z max after docking at print end.
lower_bed_on_end_default: False
lower_bed_speed: 10
# Where the bed stops when lowered at the print end (256 is the bottom).
lower_bed_z: 246
# Whether M191 blocks until the chamber reaches target, or just requests
# it and lets the print start heating in the background (M141-like).
# Toggle with C5_MISC_CHAMBER_WAIT_ON / C5_MISC_CHAMBER_WAIT_OFF.
chamber_wait_default: False

# Prime only the selected tool by default. For a multi-tool print, pass
# TOOLS=0,3 (etc.) to prepare exactly those tools; HOTEND0..3 can override
# the shared HOTEND material temperature for tools in that list.
[gcode_macro C5_PRINT_START]
description: Home, prepare used tools, mesh, check Z, then print
gcode:
  _C5_PRINT_START_AFTER_BOOT {rawparams}

# Evaluate filament sensors only after AFC's PREP and the boot settle finish.
[gcode_macro _C5_PRINT_START_AFTER_BOOT]
gcode:
  {% if 'gcode_macro _OC_DOOR_CHECK' in printer %}_OC_DOOR_CHECK{% endif %}
  {% set tool = params.TOOL|default(0)|int %}
  {% set tools_arg = params.TOOLS|default(tool|string) %}
  {% set selected = namespace(indices=[]) %}
  {% for raw in tools_arg.split(',') %}
    {% set index = raw|trim %}
    {% if index not in ['0', '1', '2', '3'] %}
      { action_raise_error("TOOLS must be a comma-separated list of 0..3") }
    {% endif %}
    {% if index|int not in selected.indices %}
      {% set selected.indices = selected.indices + [index|int] %}
    {% endif %}
  {% endfor %}
  {% set bed = params.BED|default(0)|float %}
  {% set hotend = params.HOTEND|default(0)|float %}
  {% set first_layer = params.FIRST_LAYER_HEIGHT|default(0.2)|float %}
  {% set flow = params.FLOW_CALIBRATION|default(printer['output_pin flow_calibration'].value)|int %}
  {% set purge = params.PURGE|default(printer['output_pin purge'].value)|int %}
  {% set level = params.BED_LEVELING|default(printer['output_pin bed_leveling'].value)|int %}
  {% set plate_check = params.BUILDPLATE_CHECK|default(1)|int %}
  {% if tool < 0 or tool > 3 or hotend <= 0 or first_layer <= 0 %}
    { action_raise_error("C5_PRINT_START needs TOOL=0..3 and HOTEND>0") }
  {% endif %}
  {% if tool not in selected.indices %}
    { action_raise_error("TOOL must be included in TOOLS") }
  {% endif %}
  {% if plate_check not in [0, 1] %}
    { action_raise_error("BUILDPLATE_CHECK must be 0 or 1") }
  {% endif %}
  {% if flow not in [0, 1] or purge not in [0, 1] or level not in [0, 1] %}
    { action_raise_error("FLOW_CALIBRATION, PURGE and BED_LEVELING must be 0 or 1") }
  {% endif %}
  {% set tool_temps = [params.HOTEND0|default(hotend)|float,
                       params.HOTEND1|default(hotend)|float,
                       params.HOTEND2|default(hotend)|float,
                       params.HOTEND3|default(hotend)|float] %}
  {% for index in selected.indices %}
    {% if tool_temps[index] <= 0 %}
      { action_raise_error("HOTEND temperature must be positive for each used tool") }
    {% endif %}
  {% endfor %}
  # The tool-start switches are the physical filament presence pins.  Check
  # every tool in this print, but do not require unused tools to be loaded.
  {% set missing = namespace(tools=[]) %}
  {% for index in selected.indices %}
    {% set sensor = 'filament_switch_sensor extruder' ~ index ~ '_tool_start' %}
    {% if index == 0 and sensor not in printer %}
      {% set sensor = 'filament_switch_sensor extruder_tool_start' %}
    {% endif %}
    {% if sensor not in printer or not printer[sensor].filament_detected %}
      {% set missing.tools = missing.tools + ['T' ~ index] %}
    {% endif %}
  {% endfor %}
  {% if missing.tools %}
    { action_respond_info('Cancelling print: no filament detected in selected ' ~ missing.tools|join(', ') ~ '. Load filament and retry.') }
    CANCEL_PRINT
  {% else %}
  C5_PRINT_START_TUNE
  # Warm every tool used by this print (up to 100 C) while homing and the
  # bed heat. The final material temperature is set at tool preparation.
  {% for index in selected.indices %}
    {% set preheat_heater = 'extruder' if index == 0 else 'extruder' ~ index %}
    SET_HEATER_TEMPERATURE HEATER={preheat_heater} TARGET={[100.0, tool_temps[index]]|min}
  {% endfor %}
  C5_HOME_FOR_PRINT
  {% if plate_check %}
    # Same stock-pin comparison offset calibration uses, inverted. ERROR=0:
    # a missing plate is recorded, and _OC_PRINT_START_REST cancels the print
    # (rather than the print ending in an error).
    C5_CHECK_BUILD_PLATE ERROR=0
  {% endif %}
  _OC_PRINT_START_REST {rawparams}
  {% endif %}

# Second half of C5_PRINT_START, after the build plate check (a macro only
# sees that result once the check has run). C5_PRINT_START has validated the
# parameters already.
[gcode_macro _OC_PRINT_START_REST]
gcode:
  {% set plate_check = params.BUILDPLATE_CHECK|default(1)|int %}
  {% if plate_check and printer.creator5_toolchanger.build_plate_detected == False %}
    { action_respond_info('Cancelling print: build plate not detected. Install the build plate and restart the print.') }
    CANCEL_PRINT
  {% else %}
  {% set tool = params.TOOL|default(0)|int %}
  {% set tools_arg = params.TOOLS|default(tool|string) %}
  {% set selected = namespace(indices=[]) %}
  {% for raw in tools_arg.split(',') %}
    {% if raw|trim|int not in selected.indices %}
      {% set selected.indices = selected.indices + [raw|trim|int] %}
    {% endif %}
  {% endfor %}
  {% set bed = params.BED|default(0)|float %}
  {% set hotend = params.HOTEND|default(0)|float %}
  {% set first_layer = params.FIRST_LAYER_HEIGHT|default(0.2)|float %}
  {% set flow = params.FLOW_CALIBRATION|default(printer['output_pin flow_calibration'].value)|int %}
  {% set purge = params.PURGE|default(printer['output_pin purge'].value)|int %}
  {% set level = params.BED_LEVELING|default(printer['output_pin bed_leveling'].value)|int %}
  {% set tool_temps = [params.HOTEND0|default(hotend)|float,
                       params.HOTEND1|default(hotend)|float,
                       params.HOTEND2|default(hotend)|float,
                       params.HOTEND3|default(hotend)|float] %}
  STEPPER_RESONANCE_DAMP_ENABLE
  # MPC material: explicit slots plus shared fallback for used tools only.
  {% set materials = [params.MATERIAL0|default(params.MATERIAL|default('')),
                      params.MATERIAL1|default(params.MATERIAL|default('')),
                      params.MATERIAL2|default(params.MATERIAL|default('')),
                      params.MATERIAL3|default(params.MATERIAL|default(''))] %}
  {% for index in range(4) %}
    {% if (index in selected.indices or ('MATERIAL' ~ index) in params) and materials[index]|trim %}
      _SET_MPC_MATERIAL TOOL={index} MATERIAL="{materials[index]|trim}"
    {% endif %}
  {% endfor %}
  M140 S{bed}
  {% if bed > 0 %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed}
  {% endif %}
  {% if flow or purge %}
  {% for index in selected.indices %}
    {% set prime_heater = 'extruder' if index == 0 else 'extruder' ~ index %}
    {% set prime_temp = tool_temps[index] %}
    AFC_SELECT_TOOL TOOL={prime_heater}
    C5_MOVE_TO_PURGE_BUCKET
    C5_AUTO_NOZZLE_Z T={index} HOTEND={prime_temp} BED={bed} FIRST_LAYER_HEIGHT={first_layer}
    SET_HEATER_TEMPERATURE HEATER={prime_heater} TARGET={prime_temp}
    TEMPERATURE_WAIT SENSOR={prime_heater} MINIMUM={prime_temp - 2}
    {% if flow %}
      C5_FLOW_CALIBRATION
    {% endif %}
    {% if purge %}
      C5_TOOL_PURGE
    {% endif %}
    C5_COOL_FOR_DOCK HOTEND={prime_temp}
    AFC_UNSELECT_TOOL
  {% endfor %}
  {% endif %}
  # Every used tool must be at its preheat before meshing (docking after
  # priming may have left it cooler).
  {% for index in selected.indices %}
    {% set preheat_heater = 'extruder' if index == 0 else 'extruder' ~ index %}
    {% set preheat = [100.0, tool_temps[index]]|min %}
    SET_HEATER_TEMPERATURE HEATER={preheat_heater} TARGET={preheat}
    TEMPERATURE_WAIT SENSOR={preheat_heater} MINIMUM={preheat - 2}
  {% endfor %}
  BED_MESH_CLEAR
  {% if level %}
    {% if bed > 0 %}
      C5_BED_SOAK
    {% endif %}
    BED_MESH_CALIBRATE ADAPTIVE=1
  {% elif 'default' in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE LOAD=default
  {% endif %}
  C5_CENTER_Z_CHECK
  {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
  {% set print_temp = tool_temps[tool] %}
  AFC_SELECT_TOOL TOOL={heater}
  C5_AUTO_NOZZLE_Z T={tool} HOTEND={print_temp} BED={bed} FIRST_LAYER_HEIGHT={first_layer}
  C5_VERIFY_NOZZLE_Z
  #_OC_PRINT_PARK - to be tested
  # The print's other tools (TOOLS and USED_TOOLS) wait at their slicer idle
  # temperature (IDLE0..IDLE3), or 100 C without one. At most two heat up at a
  # time: more would draw too much power.
  {% set standby = namespace(indices=selected.indices) %}
  {% for raw in (params.USED_TOOLS|default('')).split(',') %}
    {% if raw|trim in ['0', '1', '2', '3'] and raw|trim|int not in standby.indices %}
      {% set standby.indices = standby.indices + [raw|trim|int] %}
    {% endif %}
  {% endfor %}
  {% for pair in standby.indices|sort|reject('equalto', tool)|batch(2) %}
    {% for index in pair %}
      {% set standby_heater = 'extruder' if index == 0 else 'extruder' ~ index %}
      {% set idle = params['IDLE' ~ index]|default(0)|float %}
      SET_HEATER_TEMPERATURE HEATER={standby_heater} TARGET={idle if idle > 0 else 100.0}
    {% endfor %}
    {% if not loop.last %}
      {% for index in pair %}
        {% set standby_heater = 'extruder' if index == 0 else 'extruder' ~ index %}
        {% set idle = params['IDLE' ~ index]|default(0)|float %}
        TEMPERATURE_WAIT SENSOR={standby_heater} MINIMUM={(idle if idle > 0 else 100.0) - 2}
      {% endfor %}
    {% endif %}
  {% endfor %}
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={print_temp}
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={print_temp - 2}
  C5_VERIFY_NOZZLE_Z
  G90
  M82
  #_OC_PRINT_UNPARK - to be tested
  # The first layer starts next: power-loss recovery saves from here on.
  {% if 'power_loss_recovery' in printer %}
    POWER_LOSS_RECOVERY_ARM
  {% endif %}
  {% endif %}

# Where print start waits for the final heat-up: the head must leave and enter
# that spot through X256 (pull back to X256, then Y, then X; the reverse when
# the print starts), or it can't get there.
[gcode_macro _OC_PRINT_PARK]
description: Park for the final heat-up: X256, then Y20, then X265, Z2.5
variable_x: 265
variable_y: 20
variable_z: 2.5
variable_pullback_x: 256
gcode:
  {% set travel = printer.toolhead.max_velocity * 30 %}
  SAVE_GCODE_STATE NAME=oc_print_park
  G90
  {% if printer.toolhead.position.z < z %}
    G1 Z{z} F600
  {% endif %}
  G1 X{pullback_x} F{travel}
  G1 Y{y} F{travel}
  G1 X{x} F{travel}
  G1 Z{z} F600
  RESTORE_GCODE_STATE NAME=oc_print_park MOVE=0

[gcode_macro _OC_PRINT_UNPARK]
description: Leave the park when the print starts: up 1 mm, then out to X256
gcode:
  {% set park = printer['gcode_macro _OC_PRINT_PARK'] %}
  {% set travel = printer.toolhead.max_velocity * 30 %}
  SAVE_GCODE_STATE NAME=oc_print_unpark
  G91
  G1 Z1 F600
  G90
  G1 X{park.pullback_x} F{travel}
  RESTORE_GCODE_STATE NAME=oc_print_unpark MOVE=0

[gcode_macro C5_CENTER_Z_CHECK]
description: Probe bed center after meshing; does not change nozzle Z offset
gcode:
  {% set probe = printer.configfile.settings.probe %}
  SAVE_GCODE_STATE NAME=c5_center_z_check
  G90
  G1 Z5 F600
  G1 X{125 - probe.x_offset} Y{125 - probe.y_offset} F6000
  PROBE
  G1 Z5 F600
  RESTORE_GCODE_STATE NAME=c5_center_z_check MOVE=0

[gcode_macro C5_PRINT_STOP]
description: Stop heating, park the tool, optionally lower the bed
gcode:
  {% set homed = printer.toolhead.homed_axes %}
  {% set room = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
  {% set hop = [10.0, room]|min %}
  M400
  TURN_OFF_HEATERS
  M107
  M107 P2
  M107 P3
  {% if 'x' in homed and 'y' in homed and 'z' in homed %}
    {% if hop > 0 %}
      SAVE_GCODE_STATE NAME=C5_END_HOP
      G91
      G1 Z{hop} F600
      RESTORE_GCODE_STATE NAME=C5_END_HOP MOVE=0
    {% endif %}
    {% set extruder = printer.toolhead.extruder %}
    {% set afc_extruder = 'extruder0' if extruder == 'extruder' else extruder %}
    # AFC's on_shuttle samples fresh mount pins, unlike cached UI status.
    {% if printer['AFC_extruder ' ~ afc_extruder].on_shuttle %}
      AFC_UNSELECT_TOOL
    {% else %}
      # Empty shuttle is a safe no-op; a mismatched head is docked directly.
      # Invalid sensors fail here at execution, after heaters/fans are off.
      C5_TOOL_DOCK
    {% endif %}
  {% endif %}
  {% if 'z' in homed and printer['output_pin lower_bed_on_end'].value %}
    G90
    C5_LOWER_BED
    G91
  {% endif %}
  # Clears any automatic runout lane reassignment from this print without
  # touching a deliberate SET_MAP the user makes between prints -- this
  # must not live in C5_PRINT_START, which would stomp that SET_MAP the
  # moment the next print starts.
  RESET_AFC_MAPPING RUNOUT=no
  M400
  M84
  STEPPER_RESONANCE_DAMP_DISABLE
  SET_SKEW CLEAR=1
  C5_PRINT_END_TUNE

[gcode_macro CANCEL_PRINT]
description: Cancel the print and run Creator 5 tool and heater cleanup
rename_existing: CANCEL_PRINT_BASE
gcode:
  # CANCEL_PRINT_BASE changes print_stats to "cancelled".  Capture the
  # previous state so idle Cancel presses do not move or dock a tool.
  {% set active = printer.print_stats.state in ['printing', 'paused'] %}
  # Clear Mainsail's pause-at-layer requests so they do not carry into the next print.
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  CANCEL_PRINT_BASE
  M107
  M107 P2
  M107 P3
  {% if active %}
    C5_PRINT_STOP
  {% endif %}
  SET_SKEW CLEAR=1
  STEPPER_RESONANCE_DAMP_DISABLE

[gcode_macro PAUSE]
description: Pause in place and lower the bed without crossing the parked heads
rename_existing: PAUSE_BASE
gcode:
  {% set homed = printer.toolhead.homed_axes %}
  {% set requested = params.Z_HOP|default(5)|float %}
  {% set room = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
  {% set hop = [requested, room]|min %}
  {% if not printer.pause_resume.is_paused %}
    PAUSE_BASE
    {% if 'z' in homed and hop > 0 %}
      SAVE_GCODE_STATE NAME=C5_PAUSE_HOP
      G91
      G1 Z{hop} F600
      RESTORE_GCODE_STATE NAME=C5_PAUSE_HOP MOVE=0
    {% endif %}
  {% endif %}

[gcode_macro RESUME]
description: Return from the Z-only pause hop to the saved print position
rename_existing: RESUME_BASE
gcode:
  {% set requested = params.VELOCITY|default(10)|float %}
  {% set velocity = [[requested, 1]|max, 10]|min %}
  RESUME_BASE VELOCITY={velocity}

[gcode_macro C5_PREPARE_MACHINE]
description: Home XY and dock an attached head; leave the build plate installed
gcode:
  C5_RECOVER_ATTACHED

[gcode_macro C5_CALIBRATE_TOOL_POSITION]
description: Calibrate a toolhead's dock position by hand; edit T=0..3 before running
gcode:
  {% if 'T' not in params %}
    { action_raise_error("Specify T=0..3, e.g. C5_CALIBRATE_TOOL_POSITION T=1") }
  {% endif %}
  EXTRUDER_POSITION_CALIBRATE T={params.T}

[gcode_macro C5_EXTRUDER_ROTATION_CALIBRATION]
description: Extruder Rotation Calibration: set rotation_distance from the filament wheel
gcode:
  C5_EXTRUDER_ROTATION_CALIBRATE {rawparams}

[gcode_macro C5_CALIBRATE_OFFSETS]
description: Check plate, optionally refresh levelboard, then measure tools
# Single TOOL=n: LEVELBOARD=0 reuses the saved bare-reference position.
# The stock probe plate check and selected tool's levelboard measurement remain.
# TOOL=ALL always refreshes the bare-reference position.
gcode:
  {% if not params %}
    # Prompt flow lives in the toolchanger module (both firmwares).
    C5_OFFSET_WIZARD
  {% else %}
    {% set requested = params.TOOL|default('')|upper %}
    {% set z = params.Z|default(1)|int %}
    {% set save = params.SAVE|default(1)|int %}
    {% set levelboard = params.LEVELBOARD|default(1)|int %}
    {% if params.BUILDPLATE_REMOVED|default(0)|int != 1 %}
      { action_raise_error("Remove the build plate before offset calibration. Once removed, rerun C5_CALIBRATE_OFFSETS with BUILDPLATE_REMOVED=1") }
    {% endif %}
    {% if z not in [0, 1] or save not in [0, 1] or levelboard not in [0, 1] %}
      { action_raise_error("Z, SAVE and LEVELBOARD must be 0 or 1") }
    {% endif %}
    {% if z == 1 and 'SCAN_Z' in params %}
      { action_raise_error("Automatic Z probing sets the XY scan height; omit SCAN_Z") }
    {% endif %}
    {% if z == 0 and 'SCAN_Z' not in params and 'scan_height' not in printer.configfile.settings.creator5_toolchanger %}
      { action_raise_error("XY-only calibration needs scan_height or SCAN_Z=<height>") }
    {% endif %}
    {% if requested == 'ALL' %}
      {% if levelboard == 0 %}
        { action_raise_error("TOOL=ALL always calibrates the levelboard reference") }
      {% endif %}
      {% if z != 1 %}
        { action_raise_error("TOOL=ALL requires automatic Z probing (Z=1)") }
      {% endif %}
      {% set homed = printer.toolhead.homed_axes %}
      {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
        { action_raise_error("Home XYZ before all-tool offset calibration") }
      {% endif %}
      C5_CALIBRATE_ALL_OFFSETS SAVE={save} BUILDPLATE_REMOVED=1
    {% else %}
      {% if requested not in ['0', '1', '2', '3'] %}
        { action_raise_error("Specify TOOL=0..3 for automatic pickup, or TOOL=ALL") }
      {% endif %}
      {% set tool = requested|int %}
      {% if 'SCAN_Z' in params %}
        C5_TOOL_OFFSET_CALIBRATE T={tool} Z={z} SAVE={save} LEVELBOARD={levelboard} SCAN_Z={params.SCAN_Z|float} BUILDPLATE_REMOVED=1
      {% else %}
        C5_TOOL_OFFSET_CALIBRATE T={tool} Z={z} SAVE={save} LEVELBOARD={levelboard} BUILDPLATE_REMOVED=1
      {% endif %}
      {% if save %}
        C5_SAVE_OFFSETS_JSON
      {% endif %}
    {% endif %}
  {% endif %}
