# Creator 5 Pro macros for upstream Klipper.
# M900/M106/M107 come from the stock printer.macro.cfg; the gear-stepper
# macros from the stock printer.motor.cfg.

########################################
# Pressure advance and fans
########################################

[gcode_macro M900]
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[gcode_macro M106]
gcode:
  {% if 'S' in params %}
    {% set speed = params['S']|float %}
  {% else %}
    {% set speed = 255.0|float%}
  {% endif %}
  {% if 'T' in params %}
    {% set index = params['T']|int %}
  {% endif %}
  {% if 'P' in params %}
    {% set index = params['P']|int %}
  {% endif %}
  {% if index == 101 %}
      #SET_FAN_SPEED FAN=internal_fan SPEED={speed/255.0}
  {% elif index == 2 %}
      SET_FAN_SPEED FAN=chamber_loop_fan SPEED={speed/255.0}
      SET_FAN_SPEED FAN=chamber_cool_fan SPEED={speed/255.0}
  {% elif index == 3 %}
      SET_FAN_SPEED FAN=chamber_fan SPEED={speed/255.0}
  {% else %}
      SET_FAN_SPEED FAN=fanM106 SPEED={speed/255.0}
  {% endif %}

[gcode_macro M107]
gcode:
  {% if 'T' in params %}
    {% set index = params['T']|int %}
  {% endif %}
  {% if 'P' in params %}
    {% set index = params['P']|int %}
  {% endif %}
  {% if index == 101 %}
      #SET_FAN_SPEED FAN=internal_fan SPEED={0.0}
  {% elif index == 2 %}
      SET_FAN_SPEED FAN=chamber_loop_fan SPEED={0.0}
      SET_FAN_SPEED FAN=chamber_cool_fan SPEED={0.0}
  {% elif index == 3 %}
      SET_FAN_SPEED FAN=chamber_fan SPEED={0.0}
  {% else %}
      SET_FAN_SPEED FAN=fanM106 SPEED={0.0}
  {% endif %}

########################################
# 24 V heater rail
########################################

# Stock heaters.py/extruder.py force DC24V_CTL on whenever a hotend target
# is set; these wrappers reproduce that with upstream Klipper.

[gcode_macro M104]
rename_existing: M104.1
gcode:
    SET_PIN PIN=DC24V_CTL VALUE=1
    M104.1 {rawparams}

[gcode_macro M109]
rename_existing: M109.1
gcode:
    SET_PIN PIN=DC24V_CTL VALUE=1
    M109.1 {rawparams}

[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: _SET_HEATER_TEMPERATURE_BASE
gcode:
    SET_PIN PIN=DC24V_CTL VALUE=1
    _SET_HEATER_TEMPERATURE_BASE {rawparams}

########################################
# Tool-lock gear stepper (building blocks for tool changes)
########################################

[gcode_macro STEPPER_ENABLE]
gcode:
    # SET_PIN PIN=enable_gear_stepper VALUE=1

[gcode_macro STEPPER_DISABLE]
gcode:
    # SET_PIN PIN=enable_gear_stepper VALUE=0

[gcode_macro VREF_SET]
gcode:
    SET_PIN PIN=A4988_REF VALUE=0.25

[gcode_macro VREF_SET_UNLOCK]
gcode:
    SET_PIN PIN=A4988_REF VALUE=0.35

[gcode_macro STEPPER_LOCK]
gcode:
    VREF_SET
    MANUAL_STEPPER STEPPER=gear_stepper ENABLE=1 SET_POSITION=0 MOVE=0.07 SPEED=0.25 ACCEL=1.5
    # UPDATE_DELAYED_GCODE ID=LOW_VREF DURATION=0.5
    M400

[gcode_macro STEPPER_UNLOCK]
gcode:
    VREF_SET_UNLOCK
    MANUAL_STEPPER STEPPER=gear_stepper ENABLE=1 SET_POSITION=0 MOVE=-0.1 SPEED=0.5 ACCEL=1.5 STOP_ON_ENDSTOP=1 SYNC=0
    UPDATE_DELAYED_GCODE ID=LOW_VREF DURATION=1

[gcode_macro MOTOR_GRAB_MOVE]
gcode:
    G1 X295 F2400

[gcode_macro MOTOR_GRAB]
gcode:
    STEPPER_LOCK

[gcode_macro MOTOR_GRAB2]
gcode:
    VREF_SET
    MANUAL_STEPPER STEPPER=gear_stepper ENABLE=1 SET_POSITION=0 MOVE=0.03 SPEED=0.02 ACCEL=1 SYNC=0
    UPDATE_DELAYED_GCODE ID=LOW_VREF DURATION=1.7

[gcode_macro MOTOR_RELEASE]
gcode:
    STEPPER_UNLOCK

[gcode_macro MOTOR_STOP]
gcode:
    #STEPPER_DISABLE
    #G4 P100
    #M400

[gcode_macro MOTOR_LOCK_TEST]
gcode:
    MANUAL_STEPPER STEPPER=gear_stepper ENABLE=1 SET_POSITION=0 MOVE=0.07 SPEED=0.25 ACCEL=1
    MANUAL_STEPPER STEPPER=gear_stepper ENABLE=1 SET_POSITION=0 MOVE=0.03 SPEED=0.02 ACCEL=1
    MANUAL_STEPPER STEPPER=gear_stepper ENABLE=1 SET_POSITION=0 MOVE=-0.09 SPEED=0.5 ACCEL=1
