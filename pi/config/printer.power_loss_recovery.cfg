[power_loss_recovery]
state_path: ~/printer_data/power_loss_recovery.json
# How often (seconds) to snapshot state while actively printing.
save_interval: 10
# Extra Z clearance (mm) above the saved layer height when moving back
# into position before resuming, on top of whatever height the toolhead
# already homed/parked to.
min_z_clearance: 5
toolchanger: creator5_toolchanger
