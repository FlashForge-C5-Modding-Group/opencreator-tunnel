[power_loss_recovery]
state_path: ~/printer_data/power_loss_recovery.json
# How often (seconds) to snapshot state while actively printing.
save_interval: 10
# Extra Z clearance (mm) above the saved layer height when moving back
# into position before resuming, on top of whatever height the toolhead
# already homed/parked to.
min_z_clearance: 5
toolchanger: creator5_toolchanger

# Offers to resume an interrupted print with a Fluidd/Mainsail
# action:prompt dialog. Re-shown every 60s (so a browser that connects
# after the printer boots still sees it) until a button is pressed or a
# new print starts.
[delayed_gcode C5_RECOVERY_PROMPT_CHECK]
initial_duration: 10
gcode:
  {% set plr = printer.power_loss_recovery %}
  {% set dismissed = printer['gcode_macro C5_RECOVERY_PROMPT'].dismissed %}
  {% if plr.recovery_available and not dismissed
        and printer.print_stats.state not in ['printing', 'paused'] %}
    C5_RECOVERY_PROMPT
    UPDATE_DELAYED_GCODE ID=C5_RECOVERY_PROMPT_CHECK DURATION=60
  {% endif %}

[gcode_macro C5_RECOVERY_PROMPT]
description: Show the resume-interrupted-print dialog
variable_dismissed: False
gcode:
  {% set plr = printer.power_loss_recovery %}
  {% if not plr.recovery_available %}
    RESPOND MSG="No interrupted print to recover"
  {% else %}
    {% set name = (plr.filename or 'unknown')|replace('"', "'")|replace('|', '/') %}
    {% set pct = (100.0 * plr.file_position / plr.file_size) if plr.file_size else 0 %}
    RESPOND TYPE=command MSG="action:prompt_begin Print interrupted"
    RESPOND TYPE=command MSG="action:prompt_text The printer lost power or shut down during a print."
    RESPOND TYPE=command MSG="action:prompt_text File: {name}"
    RESPOND TYPE=command MSG="action:prompt_text Progress: {'%.1f' % pct}%"
    RESPOND TYPE=command MSG="action:prompt_text Resuming re-homes, reheats and selects the saved tool. Check the bed is clear of anything but the part."
    RESPOND TYPE=command MSG="action:prompt_footer_button Discard|_C5_RECOVERY_CHOICE ACTION=discard|error"
    RESPOND TYPE=command MSG="action:prompt_footer_button Later|_C5_RECOVERY_CHOICE ACTION=later"
    RESPOND TYPE=command MSG="action:prompt_footer_button Resume print|_C5_RECOVERY_CHOICE ACTION=resume|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _C5_RECOVERY_CHOICE]
gcode:
  {% set action = params.ACTION|default('later')|lower %}
  RESPOND TYPE=command MSG="action:prompt_end"
  UPDATE_DELAYED_GCODE ID=C5_RECOVERY_PROMPT_CHECK DURATION=0
  {% if action == 'resume' %}
    RECOVER_PRINT
  {% elif action == 'discard' %}
    CLEAR_POWER_LOSS_RECOVERY
  {% else %}
    SET_GCODE_VARIABLE MACRO=C5_RECOVERY_PROMPT VARIABLE=dismissed VALUE=True
    RESPOND MSG="Recovery postponed; run C5_RECOVERY_PROMPT or RECOVER_PRINT when ready"
  {% endif %}
