[bed_mesh]
speed: 200
horizontal_move_z: 3
move_check_distance: 3
mesh_min: 0, 0
mesh_max: 250, 250
probe_count: 10, 10
mesh_pps: 3, 3
adaptive_margin: 5
algorithm: bicubic
bicubic_tension: 0.8
# fade_start: 0.5
# fade_end: 5.5
# #fade_target: 0

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _OC_BED_MESH_CALIBRATE
description: Dock any attached tool, then probe the bed mesh
gcode:
  # The probe is on the carriage: an attached tool must be docked first.
  {% set tc = printer.creator5_toolchanger %}
  {% if tc.sensor_error %}
    { action_raise_error("Tool sensors invalid, not meshing: " ~ tc.sensor_error) }
  {% endif %}
  {% if tc.active_tool is not none %}
    AFC_UNSELECT_TOOL
  {% endif %}
  _OC_BED_MESH_CALIBRATE {rawparams}
