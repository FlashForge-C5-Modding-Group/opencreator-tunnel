
[duplicate_pin_override]
pins: PA2, PA15, PB9, PB13, PB14, PC12, eboard:PA3, eboard:PA15, eboard:PB12, eboard:PB14, eboard:PB15, eboard:PC15, PJ11, levelboard:PD0   #levelboard:PA2

# SBC-specific: not part of stock, the Pi running Klipper over the tunnel
# has no equivalent on the printer itself.
[temperature_sensor host_pi]
sensor_type: temperature_host

# Required by C5_FLOW_CALIBRATION (creator5_toolchanger.py's flow-strokes
# command): the eboard classifies the motor-current waveform during flow
# calibration via custom MCU commands (get_emcu_pa_value/pa_action), which
# this module looks up. Not present anywhere in current stock opencreator-fs
# config -- this is a newer feature in this fork branch stock hasn't picked
# up yet, not something dropped during the tunnel adaptation.
[pa_adjust]

