# Creator 5 print controls are virtual output pins without physical MCU pins. Their settings
# persist across Klipper restarts in the save_variables file below.
[save_variables]
filename: ~/printer_data/config/c5_misc_variables.cfg

[gcode_macro C5_MISC]
description: Show print preparation, end, and tune switches
gcode:
  { action_respond_info("Flow calibration: %s; purge: %s; bed leveling: %s; bed soak: %s; clog detection: %s; lower bed at print end: %s; quiet mode: %s; chamber wait: %s; door notify: %s" %
    ("ON" if printer["output_pin flow_calibration"].value else "OFF",
     "ON" if printer["output_pin purge"].value else "OFF",
     "ON" if printer["output_pin bed_leveling"].value else "OFF",
     "ON" if printer["output_pin bed_soak"].value else "OFF",
     "ON" if printer["output_pin clog_detection"].value else "OFF",
     "ON" if printer["output_pin lower_bed_on_end"].value else "OFF",
     "ON" if printer["output_pin quiet_mode"].value else "OFF",
     "ON" if printer["output_pin chamber_wait"].value else "OFF",
     "ON" if printer["output_pin door_notify"].value else "OFF")) }
  C5_DOORS

[gcode_macro C5_MISC_BED_LEVEL_ON]
description: Enable fresh bed mesh calibration before each print
gcode:
  SET_PIN PIN=bed_leveling VALUE=1
  C5_MISC

[gcode_macro C5_MISC_BED_LEVEL_OFF]
description: Use saved bed mesh without recalibrating before each print
gcode:
  SET_PIN PIN=bed_leveling VALUE=0
  C5_MISC

[gcode_macro C5_MISC_BED_SOAK_ON]
description: Soak the heated bed before each fresh print mesh
gcode:
  SET_PIN PIN=bed_soak VALUE=1
  C5_MISC

[gcode_macro C5_MISC_BED_SOAK_OFF]
description: Skip bed soak before print mesh
gcode:
  SET_PIN PIN=bed_soak VALUE=0
  C5_MISC

# These Creator5MiscSwitch objects are virtual output_pin controls so Fluidd
# shows them under Fans & Outputs. They do not control physical fan pins.
# These macro pairs also provide UI-agnostic on/off buttons.
[gcode_macro C5_MISC_FLOW_CALIBRATION_ON]
description: Enable flow calibration before print start
gcode:
  SET_PIN PIN=flow_calibration VALUE=1
  C5_MISC

[gcode_macro C5_MISC_FLOW_CALIBRATION_OFF]
description: Disable flow calibration before print start
gcode:
  SET_PIN PIN=flow_calibration VALUE=0
  C5_MISC

[gcode_macro C5_MISC_PURGE_ON]
description: Enable the tool purge before print start
gcode:
  SET_PIN PIN=purge VALUE=1
  C5_MISC

[gcode_macro C5_MISC_PURGE_OFF]
description: Disable the tool purge before print start
gcode:
  SET_PIN PIN=purge VALUE=0
  C5_MISC

[gcode_macro C5_MISC_QUIET_MODE_ON]
description: Silence the buzzer
gcode:
  SET_PIN PIN=quiet_mode VALUE=1
  C5_MISC

[gcode_macro C5_MISC_QUIET_MODE_OFF]
description: Re-enable the buzzer
gcode:
  SET_PIN PIN=quiet_mode VALUE=0
  C5_MISC

[gcode_macro C5_MISC_CHAMBER_WAIT_ON]
description: M191 blocks until the chamber actually reaches target
gcode:
  SET_PIN PIN=chamber_wait VALUE=1
  C5_MISC

[gcode_macro C5_MISC_CHAMBER_WAIT_OFF]
description: M191 only requests the chamber target and returns immediately
gcode:
  SET_PIN PIN=chamber_wait VALUE=0
  C5_MISC

[gcode_macro C5_MISC_DOOR_NOTIFY_ON]
description: Notify when a door is open during a print
gcode:
  SET_PIN PIN=door_notify VALUE=1
  C5_MISC

[gcode_macro C5_MISC_DOOR_NOTIFY_OFF]
description: Don't notify about open doors
gcode:
  SET_PIN PIN=door_notify VALUE=0
  C5_MISC

[gcode_macro C5_DOORS]
description: Show whether the top and front doors are open
gcode:
  { action_respond_info("Doors: top %s, front %s" %
    ("closed" if printer["gcode_button topDoor"].state == "PRESSED" else "open",
     "closed" if printer["gcode_button frontDoor"].state == "PRESSED" else "open")) }

# Run by the door switches. With door notify on, opening a door during a
# print notifies.
[gcode_macro _OC_DOOR]
gcode:
  {% if params.STATE == "open" and printer["output_pin door_notify"].value
        and printer.print_stats.state in ["printing", "paused"] %}
    _OC_DOOR_NOTIFY MSG="The {params.DOOR} door was opened during the print"
  {% endif %}

# Run at print start: with door notify on, a door left open notifies.
[gcode_macro _OC_DOOR_CHECK]
gcode:
  {% set open = [] %}
  {% for door, button in [("top", "topDoor"), ("front", "frontDoor")] %}
    {% if printer["gcode_button " ~ button].state != "PRESSED" %}
      {% set _ = open.append(door) %}
    {% endif %}
  {% endfor %}
  {% if open and printer["output_pin door_notify"].value %}
    _OC_DOOR_NOTIFY MSG="The {open|join(' and ')} door{'s are' if open|length > 1 else ' is'} open at print start"
  {% endif %}

# Console error (a pop-up in Fluidd and Mainsail), a beep unless quiet mode
# is on, and Moonraker's [notifier door_open] if one is set up.
[gcode_macro _OC_DOOR_NOTIFY]
gcode:
  RESPOND TYPE=error MSG="{params.MSG}"
  BEEP DURATION=300 OPTIONAL=1
  { action_call_remote_method("notify", name="door_open", message=params.MSG) }

# First-time setup dialog, shown in Fluidd/Mainsail (and on the screen) until
# it has been completed once. See CREATOR5_TOOLCHANGER.md. The step is saved,
# so the dialog picks up where it was after a Klipper restart.
[delayed_gcode C5_FIRST_SETUP_CHECK]
initial_duration: 10
gcode:
  {% set vars = printer.save_variables.variables %}
  {% if not vars.c5_first_setup_done|default(0) %}
    {% if printer.print_stats.state not in ['printing', 'paused'] %}
      _OC_FIRST_SETUP STEP={vars.c5_first_setup_step|default(0)}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=C5_FIRST_SETUP_CHECK DURATION=60
  {% endif %}

[gcode_macro C5_FIRST_SETUP]
description: Run the OpenCreator first-time setup again
gcode:
  SAVE_VARIABLE VARIABLE=c5_first_setup_done VALUE=0
  _OC_FIRST_SETUP STEP=0

[gcode_macro _OC_FIRST_SETUP]
# Input shaper and PID come from FlashForge's calibration, imported by the
# installer, and the tool offsets and docks from its calibration files, so the
# dialog only asks for the options.
gcode:
  {% set step = params.STEP|default(0)|int %}
  {% if params.FLOW is defined %}
    SET_PIN PIN=flow_calibration VALUE={params.FLOW|int}
  {% endif %}
  {% if params.PURGE is defined %}
    SET_PIN PIN=purge VALUE={params.PURGE|int}
  {% endif %}
  {% if params.CLOG is defined %}
    SET_PIN PIN=clog_detection VALUE={params.CLOG|int}
  {% endif %}
  {% if params.SOAK is defined %}
    SET_PIN PIN=bed_soak VALUE={params.SOAK|int}
  {% endif %}
  {% if step <= 6 and printer.save_variables.variables.c5_first_setup_step|default(0) != step %}
    SAVE_VARIABLE VARIABLE=c5_first_setup_step VALUE={step}
  {% endif %}
  {% if step == 0 %}
    RESPOND TYPE=command MSG="action:prompt_begin OpenCreator"
    RESPOND TYPE=command MSG="action:prompt_text Welcome to OpenCreator! We'll setup your Printer as you'd love!"
    RESPOND TYPE=command MSG="action:prompt_text All of your previous settings have been imported: input shaper, hotend and bed PID from FlashForge's calibration, and your tool offsets, Z offsets and dock positions."
    RESPOND TYPE=command MSG="action:prompt_footer_button Let's get started!|_OC_FIRST_SETUP STEP=1|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 1 %}
    RESPOND TYPE=command MSG="action:prompt_begin Pressure Advance Calibration"
    RESPOND TYPE=command MSG="action:prompt_text Do you want pressure advance calibration (flow calibration) to run at the start of every print?"
    RESPOND TYPE=command MSG="action:prompt_text It measures each tool's pressure advance over the purge bucket before printing."
    RESPOND TYPE=command MSG="action:prompt_footer_button No|_OC_FIRST_SETUP STEP=2 FLOW=0"
    RESPOND TYPE=command MSG="action:prompt_footer_button Yes|_OC_FIRST_SETUP STEP=2 FLOW=1|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 2 %}
    RESPOND TYPE=command MSG="action:prompt_begin Purging"
    RESPOND TYPE=command MSG="action:prompt_text Do you want each tool purged into the bucket at the start of every print?"
    RESPOND TYPE=command MSG="action:prompt_footer_button No|_OC_FIRST_SETUP STEP=3 PURGE=0"
    RESPOND TYPE=command MSG="action:prompt_footer_button Yes|_OC_FIRST_SETUP STEP=3 PURGE=1|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 3 %}
    RESPOND TYPE=command MSG="action:prompt_begin Clog Detection"
    RESPOND TYPE=command MSG="action:prompt_text Do you want Clog Detection enabled?"
    RESPOND TYPE=command MSG="action:prompt_footer_button No|_OC_FIRST_SETUP STEP=4 CLOG=0"
    RESPOND TYPE=command MSG="action:prompt_footer_button Yes|_OC_FIRST_SETUP STEP=4 CLOG=1|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 4 %}
    RESPOND TYPE=command MSG="action:prompt_begin Bed Heat Soak"
    RESPOND TYPE=command MSG="action:prompt_text Do you want bed heat soaking enabled?"
    RESPOND TYPE=command MSG="action:prompt_footer_button No|_OC_FIRST_SETUP STEP=5 SOAK=0"
    RESPOND TYPE=command MSG="action:prompt_footer_button Yes|_OC_FIRST_SETUP STEP=5 SOAK=1|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 5 %}
    RESPOND TYPE=command MSG="action:prompt_begin Offsets and docking"
    RESPOND TYPE=command MSG="action:prompt_text Your tool offsets and dock positions come from FlashForge's calibration."
    RESPOND TYPE=command MSG="action:prompt_text If the tools' offsets were not right on the normal firmware either, run C5_CALIBRATE_OFFSETS."
    RESPOND TYPE=command MSG="action:prompt_text If a tool does not dock or pick up cleanly, run C5_CALIBRATE_TOOL_POSITION."
    RESPOND TYPE=command MSG="action:prompt_footer_button Next|_OC_FIRST_SETUP STEP=6|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 6 %}
    SAVE_VARIABLE VARIABLE=c5_first_setup_done VALUE=1
    UPDATE_DELAYED_GCODE ID=C5_FIRST_SETUP_CHECK DURATION=0
    RESPOND TYPE=command MSG="action:prompt_begin Thank you!"
    RESPOND TYPE=command MSG="action:prompt_text Thank you for using the first version of OpenCreator, Public Alpha Version 1! You're all set."
    RESPOND TYPE=command MSG="action:prompt_text If you have any issues with your printer or any questions, feel free to ask in our Discord @ https://discord.gg/RsdkqDtfww"
    RESPOND TYPE=command MSG="action:prompt_footer_button Finish|_OC_FIRST_SETUP STEP=7|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    SAVE_VARIABLE VARIABLE=c5_first_setup_step VALUE=0
    RESPOND TYPE=command MSG="action:prompt_end"
  {% endif %}

[gcode_macro C5_MISC_LOWER_BED_ON_END_ON]
description: Lower the bed to physical Z max after docking at print end
gcode:
  SET_PIN PIN=lower_bed_on_end VALUE=1
  C5_MISC

[gcode_macro C5_MISC_LOWER_BED_ON_END_OFF]
description: Leave the bed at its print-end height
gcode:
  SET_PIN PIN=lower_bed_on_end VALUE=0
  C5_MISC

[gcode_macro BEEP]
description: Sound the buzzer; DURATION in ms, FREQUENCY in Hz, LEVEL 0-100
variable_duration: 5000
variable_frequency: 2500
variable_level: 100
gcode:
  {% set defaults = printer['gcode_macro BEEP'] %}
  {% if not printer["output_pin quiet_mode"].value %}
    C5_BUZZER DURATION={params.DURATION|default(defaults.duration)} FREQUENCY={params.FREQUENCY|default(defaults.frequency)} LEVEL={params.LEVEL|default(defaults.level)} OPTIONAL={params.OPTIONAL|default(0)}
  {% endif %}

[delayed_gcode C5_STARTUP_TUNE_DELAY]
initial_duration: 2
gcode:
  C5_STARTUP_TUNE

[gcode_macro C5_STARTUP_TUNE]
description: Play the Creator 5 startup melody
gcode:
  {% set t = params.TEMPO|default(0.8)|float %}
  # [frequency Hz, duration ms] — frequency 0 = rest
  {% set notes = [
      [784, 70], [0, 15], [1047, 70], [0, 15], [1319, 70], [0, 15], [1568, 160], [0, 60],
      [1397, 60], [1319, 60], [1175, 60], [1319, 100], [0, 45],
      [1568, 70], [0, 20], [2093, 380]
  ] %}
  {% for n in notes %}
    {% if n[0] == 0 %}
      BEEP DURATION={(n[1] / t)|int} LEVEL=0 OPTIONAL=1
    {% else %}
      BEEP DURATION={(n[1] / t)|int} FREQUENCY={n[0]} OPTIONAL=1
    {% endif %}
  {% endfor %}

[gcode_macro C5_PRINT_START_TUNE]
description: Play the Creator 5 print-start melody
gcode:
  {% set t = params.TEMPO|default(1.0)|float %}
  # [frequency Hz, duration ms] — frequency 0 = rest
  {% set notes = [
      [1047, 55], [0, 30], [1047, 55], [0, 30],
      [1319, 60], [0, 15], [1568, 60], [0, 15], [2093, 260]
  ] %}
  {% for n in notes %}
    {% if n[0] == 0 %}
      BEEP DURATION={(n[1] / t)|int} LEVEL=0 OPTIONAL=1
    {% else %}
      BEEP DURATION={(n[1] / t)|int} FREQUENCY={n[0]} OPTIONAL=1
    {% endif %}
  {% endfor %}

[gcode_macro C5_PRINT_END_TUNE]
description: Play the Creator 5 print-end melody (TEMPO=1.0 default, >1 = faster)
gcode:
  {% set t = params.TEMPO|default(1.0)|float %}
  # [frequency Hz, duration ms] — frequency 0 = rest
  {% set notes = [
      [1568, 80], [0, 20], [1319, 80], [0, 20], [1047, 110], [0, 50],
      [1175, 65], [0, 15], [1397, 65], [0, 15], [1976, 100], [0, 25],
      [2093, 450]
  ] %}
  {% for n in notes %}
    {% if n[0] == 0 %}
      BEEP DURATION={(n[1] / t)|int} LEVEL=0 OPTIONAL=1
    {% else %}
      BEEP DURATION={(n[1] / t)|int} FREQUENCY={n[0]} OPTIONAL=1
    {% endif %}
  {% endfor %}

# Stock print preparation tests PA/flow with alternating slow and fast strokes
# about 8 mm above the bed before the separate normal purge and cooldown.
[gcode_macro C5_FLOW_CALIBRATION]
description: Measure stock-style alternating-speed strokes before purge and cooldown
gcode:
  C5_FLOW_STROKES

[screws_tilt_adjust]
screw1: 25, 245
screw1_name: rear left screw
screw2: 235, 245
screw2_name: rear right screw
screw3: 235, 15
screw3_name: front right screw
screw4: 25, 15 
screw4_name: front left screw
horizontal_move_z: 10
speed: 100
screw_thread: CW-M4

[gcode_macro C5_SCREWS_TILT]
description: Home if needed, then measure the four bed screws and show the turns to level them
gcode:
  {% if printer.toolhead.homed_axes != 'xyz' %}
    G28
  {% endif %}
  SCREWS_TILT_CALCULATE

[creator5_midi]
# Optional override for the default volume level (1-100)
level: 60
# Optional custom folder path (defaults to <config_dir>/midi)
# folder: ~/printer_data/config/midi

[gcode_macro PLAY_MIDI]
description: Play a MIDI file on the host PWM buzzer
gcode:
    {% set file = params.FILE|default('') %}
    {% set speed = params.SPEED|default(1.0)|float %}
    {% set level = params.LEVEL|default(60)|int %}
    {% set transpose = params.TRANSPOSE|default(0)|int %}
    {% set channel = params.CHANNEL|default(0)|int %}

    {% if not file %}
        {action_respond_info("Usage: PLAY_MIDI FILE=<filename> [SPEED=1.0] [LEVEL=60] [TRANSPOSE=0] [CHANNEL=0]")}
        C5_MIDI_LIST
    {% else %}
        C5_MIDI FILE="{file}" SPEED={speed} LEVEL={level} TRANSPOSE={transpose} CHANNEL={channel}
    {% endif %}

[gcode_macro STOP_MIDI]
description: Stop current MIDI playback
gcode:
    C5_MIDI_STOP
