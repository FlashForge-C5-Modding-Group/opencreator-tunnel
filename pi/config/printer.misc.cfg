# Creator 5 print controls are virtual output pins without physical MCU pins. Their settings
# persist across Klipper restarts in the save_variables file below.
[save_variables]
filename: ~/printer_data/config/c5_misc_variables.cfg

[gcode_macro C5_MISC]
description: Show print preparation, end, and tune switches
gcode:
  { action_respond_info("Flow calibration: %s; purge: %s; bed leveling: %s; bed soak: %s; clog detection: %s; lower bed at print end: %s; quiet mode: %s; chamber wait: %s" %
    ("ON" if printer["output_pin flow_calibration"].value else "OFF",
     "ON" if printer["output_pin purge"].value else "OFF",
     "ON" if printer["output_pin bed_leveling"].value else "OFF",
     "ON" if printer["output_pin bed_soak"].value else "OFF",
     "ON" if printer["output_pin clog_detection"].value else "OFF",
     "ON" if printer["output_pin lower_bed_on_end"].value else "OFF",
     "ON" if printer["output_pin quiet_mode"].value else "OFF",
     "ON" if printer["output_pin chamber_wait"].value else "OFF")) }

[gcode_macro C5_MISC_BED_LEVEL_ON]
description: Enable fresh bed mesh calibration before each print
gcode:
  SET_PIN PIN=bed_leveling VALUE=1
  C5_MISC

[gcode_macro C5_MISC_BED_LEVEL_OFF]
description: Use saved bed mesh without recalibrating before each print
gcode:
  SET_PIN PIN=bed_leveling VALUE=0
  C5_MISC

[gcode_macro C5_MISC_BED_SOAK_ON]
description: Soak the heated bed before each fresh print mesh
gcode:
  SET_PIN PIN=bed_soak VALUE=1
  C5_MISC

[gcode_macro C5_MISC_BED_SOAK_OFF]
description: Skip bed soak before print mesh
gcode:
  SET_PIN PIN=bed_soak VALUE=0
  C5_MISC

# These Creator5MiscSwitch objects are virtual output_pin controls so Fluidd
# shows them under Fans & Outputs. They do not control physical fan pins.
# These macro pairs also provide UI-agnostic on/off buttons.
[gcode_macro C5_MISC_FLOW_CALIBRATION_ON]
description: Enable flow calibration before print start
gcode:
  SET_PIN PIN=flow_calibration VALUE=1
  C5_MISC

[gcode_macro C5_MISC_FLOW_CALIBRATION_OFF]
description: Disable flow calibration before print start
gcode:
  SET_PIN PIN=flow_calibration VALUE=0
  C5_MISC

[gcode_macro C5_MISC_PURGE_ON]
description: Enable the tool purge before print start
gcode:
  SET_PIN PIN=purge VALUE=1
  C5_MISC

[gcode_macro C5_MISC_PURGE_OFF]
description: Disable the tool purge before print start
gcode:
  SET_PIN PIN=purge VALUE=0
  C5_MISC

[gcode_macro C5_MISC_QUIET_MODE_ON]
description: Silence the buzzer
gcode:
  SET_PIN PIN=quiet_mode VALUE=1
  C5_MISC

[gcode_macro C5_MISC_QUIET_MODE_OFF]
description: Re-enable the buzzer
gcode:
  SET_PIN PIN=quiet_mode VALUE=0
  C5_MISC

[gcode_macro C5_MISC_CHAMBER_WAIT_ON]
description: M191 blocks until the chamber actually reaches target
gcode:
  SET_PIN PIN=chamber_wait VALUE=1
  C5_MISC

[gcode_macro C5_MISC_CHAMBER_WAIT_OFF]
description: M191 only requests the chamber target and returns immediately
gcode:
  SET_PIN PIN=chamber_wait VALUE=0
  C5_MISC

# First-time setup dialog, shown in Fluidd/Mainsail (and on the screen) until
# it has been completed once. See CREATOR5_TOOLCHANGER.md.
[delayed_gcode C5_FIRST_SETUP_CHECK]
initial_duration: 10
gcode:
  {% if not printer.save_variables.variables.c5_first_setup_done|default(0) %}
    {% if printer.print_stats.state not in ['printing', 'paused'] %}
      _OC_FIRST_SETUP STEP={printer['gcode_macro _OC_FIRST_SETUP'].step}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=C5_FIRST_SETUP_CHECK DURATION=60
  {% endif %}

[gcode_macro C5_FIRST_SETUP]
description: Run the OpenCreator first-time setup again
gcode:
  _OC_FIRST_SETUP STEP=0

[gcode_macro _OC_FIRST_SETUP]
variable_step: 0
gcode:
  {% set step = params.STEP|default(0)|int %}
  {% if params.CLOG is defined %}
    SET_PIN PIN=clog_detection VALUE={params.CLOG|int}
  {% endif %}
  {% if params.SOAK is defined %}
    SET_PIN PIN=bed_soak VALUE={params.SOAK|int}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_OC_FIRST_SETUP VARIABLE=step VALUE={step}
  {% if step == 0 %}
    RESPOND TYPE=command MSG="action:prompt_begin OpenCreator"
    RESPOND TYPE=command MSG="action:prompt_text Welcome to OpenCreator! We'll setup your Printer as you'd love!"
    RESPOND TYPE=command MSG="action:prompt_footer_button Let's get started!|_OC_FIRST_SETUP STEP=1|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 1 %}
    RESPOND TYPE=command MSG="action:prompt_begin Clog Detection"
    RESPOND TYPE=command MSG="action:prompt_text Do you want Clog Detection enabled?"
    RESPOND TYPE=command MSG="action:prompt_footer_button No|_OC_FIRST_SETUP STEP=2 CLOG=0"
    RESPOND TYPE=command MSG="action:prompt_footer_button Yes|_OC_FIRST_SETUP STEP=2 CLOG=1|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 2 %}
    RESPOND TYPE=command MSG="action:prompt_begin Bed Heat Soak"
    RESPOND TYPE=command MSG="action:prompt_text Do you want bed heat soaking enabled?"
    RESPOND TYPE=command MSG="action:prompt_footer_button No|_OC_FIRST_SETUP STEP=3 SOAK=0"
    RESPOND TYPE=command MSG="action:prompt_footer_button Yes|_OC_FIRST_SETUP STEP=3 SOAK=1|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 3 %}
    RESPOND TYPE=command MSG="action:prompt_begin Recalibrate"
    RESPOND TYPE=command MSG="action:prompt_text OpenCreator does not use FlashForge's calibration, so recalibrate before printing: run CALIBRATE_INPUT_SHAPER for input shaping, and C5_PID_CALIBRATE to PID-tune all four tools. Both save the results to your config and restart Klipper."
    RESPOND TYPE=command MSG="action:prompt_footer_button Got it|_OC_FIRST_SETUP STEP=4|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 4 %}
    SAVE_VARIABLE VARIABLE=c5_first_setup_done VALUE=1
    UPDATE_DELAYED_GCODE ID=C5_FIRST_SETUP_CHECK DURATION=0
    RESPOND TYPE=command MSG="action:prompt_begin You're all set!"
    RESPOND TYPE=command MSG="action:prompt_text If you have any issues with your printer or any questions, feel free to ask in our Discord @ https://discord.gg/RsdkqDtfww"
    RESPOND TYPE=command MSG="action:prompt_footer_button Finish|_OC_FIRST_SETUP STEP=5|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    SET_GCODE_VARIABLE MACRO=_OC_FIRST_SETUP VARIABLE=step VALUE=0
    RESPOND TYPE=command MSG="action:prompt_end"
  {% endif %}

[gcode_macro C5_MISC_LOWER_BED_ON_END_ON]
description: Lower the bed to physical Z max after docking at print end
gcode:
  SET_PIN PIN=lower_bed_on_end VALUE=1
  C5_MISC

[gcode_macro C5_MISC_LOWER_BED_ON_END_OFF]
description: Leave the bed at its print-end height
gcode:
  SET_PIN PIN=lower_bed_on_end VALUE=0
  C5_MISC

[gcode_macro BEEP]
description: Sound the buzzer; DURATION in ms, FREQUENCY in Hz, LEVEL 0-100
variable_duration: 5000
variable_frequency: 2500
variable_level: 100
gcode:
  {% set defaults = printer['gcode_macro BEEP'] %}
  {% if not printer["output_pin quiet_mode"].value %}
    C5_BUZZER DURATION={params.DURATION|default(defaults.duration)} FREQUENCY={params.FREQUENCY|default(defaults.frequency)} LEVEL={params.LEVEL|default(defaults.level)} OPTIONAL={params.OPTIONAL|default(0)}
  {% endif %}

[delayed_gcode C5_STARTUP_TUNE_DELAY]
initial_duration: 2
gcode:
  C5_STARTUP_TUNE

[gcode_macro C5_STARTUP_TUNE]
description: Play the Creator 5 startup melody
gcode:
  {% set t = params.TEMPO|default(0.8)|float %}
  # [frequency Hz, duration ms] — frequency 0 = rest
  {% set notes = [
      [784, 70], [0, 15], [1047, 70], [0, 15], [1319, 70], [0, 15], [1568, 160], [0, 60],
      [1397, 60], [1319, 60], [1175, 60], [1319, 100], [0, 45],
      [1568, 70], [0, 20], [2093, 380]
  ] %}
  {% for n in notes %}
    {% if n[0] == 0 %}
      BEEP DURATION={(n[1] / t)|int} LEVEL=0 OPTIONAL=1
    {% else %}
      BEEP DURATION={(n[1] / t)|int} FREQUENCY={n[0]} OPTIONAL=1
    {% endif %}
  {% endfor %}

[gcode_macro C5_PRINT_START_TUNE]
description: Play the Creator 5 print-start melody
gcode:
  {% set t = params.TEMPO|default(1.0)|float %}
  # [frequency Hz, duration ms] — frequency 0 = rest
  {% set notes = [
      [1047, 55], [0, 30], [1047, 55], [0, 30],
      [1319, 60], [0, 15], [1568, 60], [0, 15], [2093, 260]
  ] %}
  {% for n in notes %}
    {% if n[0] == 0 %}
      BEEP DURATION={(n[1] / t)|int} LEVEL=0 OPTIONAL=1
    {% else %}
      BEEP DURATION={(n[1] / t)|int} FREQUENCY={n[0]} OPTIONAL=1
    {% endif %}
  {% endfor %}

[gcode_macro C5_PRINT_END_TUNE]
description: Play the Creator 5 print-end melody (TEMPO=1.0 default, >1 = faster)
gcode:
  {% set t = params.TEMPO|default(1.0)|float %}
  # [frequency Hz, duration ms] — frequency 0 = rest
  {% set notes = [
      [1568, 80], [0, 20], [1319, 80], [0, 20], [1047, 110], [0, 50],
      [1175, 65], [0, 15], [1397, 65], [0, 15], [1976, 100], [0, 25],
      [2093, 450]
  ] %}
  {% for n in notes %}
    {% if n[0] == 0 %}
      BEEP DURATION={(n[1] / t)|int} LEVEL=0 OPTIONAL=1
    {% else %}
      BEEP DURATION={(n[1] / t)|int} FREQUENCY={n[0]} OPTIONAL=1
    {% endif %}
  {% endfor %}

# Stock print preparation tests PA/flow with alternating slow and fast strokes
# about 8 mm above the bed before the separate normal purge and cooldown.
[gcode_macro C5_FLOW_CALIBRATION]
description: Measure stock-style alternating-speed strokes before purge and cooldown
gcode:
  C5_FLOW_STROKES
