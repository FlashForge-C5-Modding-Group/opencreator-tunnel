# Creator 5 print controls. Flow calibration, purge, and lower_bed_on_end are
# virtual Misc switches like AFC Quiet Mode. All six choices persist across
# Klipper restarts in the save_variables file below.
[save_variables]
filename: ~/printer_data/config/c5_misc_variables.cfg

[gcode_macro C5_MISC]
description: Show print preparation, end, and tune switches
gcode:
  {% set saved = printer.save_variables.variables %}
  { action_respond_info("Flow calibration: %s; purge: %s; bed leveling: %s; lower bed at print end: %s; quiet mode: %s; startup tune: %s; print-start tune: %s" %
    ("ON" if printer["filament_switch_sensor flow_calibration"].enabled else "OFF",
     "ON" if printer["filament_switch_sensor purge"].enabled else "OFF",
     "ON" if saved.c5_bed_leveling|default(1)|int else "OFF",
     "ON" if printer["filament_switch_sensor lower_bed_on_end"].enabled else "OFF",
     "ON" if printer["filament_switch_sensor quiet_mode"].enabled else "OFF",
     "ON" if saved.c5_startup_tune|default(1)|int else "OFF",
     "ON" if saved.c5_print_start_tune|default(1)|int else "OFF")) }

[gcode_macro C5_MISC_BED_LEVEL_ON]
description: Enable fresh bed mesh calibration before each print
gcode:
  SAVE_VARIABLE VARIABLE=c5_bed_leveling VALUE=1
  C5_MISC

[gcode_macro C5_MISC_BED_LEVEL_OFF]
description: Use saved bed mesh without recalibrating before each print
gcode:
  SAVE_VARIABLE VARIABLE=c5_bed_leveling VALUE=0
  C5_MISC

[gcode_macro C5_MISC_STARTUP_TUNE_ON]
description: Enable the startup tune, including after reboot
gcode:
  SAVE_VARIABLE VARIABLE=c5_startup_tune VALUE=1
  C5_MISC

[gcode_macro C5_MISC_STARTUP_TUNE_OFF]
description: Disable the startup tune, including after reboot
gcode:
  SAVE_VARIABLE VARIABLE=c5_startup_tune VALUE=0
  C5_MISC

[gcode_macro C5_MISC_PRINT_TUNE_ON]
description: Enable the print-start tune
gcode:
  SAVE_VARIABLE VARIABLE=c5_print_start_tune VALUE=1
  C5_MISC

[gcode_macro C5_MISC_PRINT_TUNE_OFF]
description: Disable the print-start tune
gcode:
  SAVE_VARIABLE VARIABLE=c5_print_start_tune VALUE=0
  C5_MISC

# Flow calibration, purge, quiet mode and lower-bed-at-end are Creator5MiscSwitch
# objects (creator5_toolchanger.py) -- registered as "filament_switch_sensor
# NAME" for gcode-command compatibility, but deliberately never a real sensor,
# so neither Fluidd nor KlipperScreen discovers them as toggleable switches.
# These macro pairs give reliable, UI-agnostic buttons for the same settings.
[gcode_macro C5_MISC_FLOW_CALIBRATION_ON]
description: Enable flow calibration before print start
gcode:
  SET_FILAMENT_SENSOR SENSOR=flow_calibration ENABLE=1
  C5_MISC

[gcode_macro C5_MISC_FLOW_CALIBRATION_OFF]
description: Disable flow calibration before print start
gcode:
  SET_FILAMENT_SENSOR SENSOR=flow_calibration ENABLE=0
  C5_MISC

[gcode_macro C5_MISC_PURGE_ON]
description: Enable the tool purge before print start
gcode:
  SET_FILAMENT_SENSOR SENSOR=purge ENABLE=1
  C5_MISC

[gcode_macro C5_MISC_PURGE_OFF]
description: Disable the tool purge before print start
gcode:
  SET_FILAMENT_SENSOR SENSOR=purge ENABLE=0
  C5_MISC

[gcode_macro C5_MISC_QUIET_MODE_ON]
description: Silence the buzzer
gcode:
  SET_FILAMENT_SENSOR SENSOR=quiet_mode ENABLE=1
  C5_MISC

[gcode_macro C5_MISC_QUIET_MODE_OFF]
description: Re-enable the buzzer
gcode:
  SET_FILAMENT_SENSOR SENSOR=quiet_mode ENABLE=0
  C5_MISC

[gcode_macro C5_MISC_LOWER_BED_ON_END_ON]
description: Lower the bed to physical Z max after docking at print end
gcode:
  SET_FILAMENT_SENSOR SENSOR=lower_bed_on_end ENABLE=1
  C5_MISC

[gcode_macro C5_MISC_LOWER_BED_ON_END_OFF]
description: Leave the bed at its print-end height
gcode:
  SET_FILAMENT_SENSOR SENSOR=lower_bed_on_end ENABLE=0
  C5_MISC

[gcode_macro BEEP]
description: Sound the buzzer; DURATION in ms, FREQUENCY in Hz, LEVEL 0-100
variable_duration: 5000
variable_frequency: 2500
variable_level: 100
gcode:
  {% set defaults = printer['gcode_macro BEEP'] %}
  {% if not printer["filament_switch_sensor quiet_mode"].enabled %}
    C5_BUZZER DURATION={params.DURATION|default(defaults.duration)} FREQUENCY={params.FREQUENCY|default(defaults.frequency)} LEVEL={params.LEVEL|default(defaults.level)} OPTIONAL={params.OPTIONAL|default(0)}
  {% endif %}

[delayed_gcode C5_STARTUP_TUNE_DELAY]
initial_duration: 2
gcode:
  C5_STARTUP_TUNE

[gcode_macro C5_STARTUP_TUNE]
description: Play the Creator 5 startup melody when enabled in Misc
gcode:
  {% if printer.save_variables.variables.c5_startup_tune|default(1)|int %}
    BEEP DURATION=110 FREQUENCY=523 OPTIONAL=1
    BEEP DURATION=110 FREQUENCY=659 OPTIONAL=1
    BEEP DURATION=110 FREQUENCY=784 OPTIONAL=1
    BEEP DURATION=110 FREQUENCY=1047 OPTIONAL=1
    BEEP DURATION=40 LEVEL=0 OPTIONAL=1
    BEEP DURATION=130 FREQUENCY=1319 OPTIONAL=1
    BEEP DURATION=320 FREQUENCY=1568 OPTIONAL=1
  {% endif %}

[gcode_macro C5_PRINT_START_TUNE]
description: Play the Creator 5 print-start melody when enabled in Misc
gcode:
  {% if printer.save_variables.variables.c5_print_start_tune|default(1)|int %}
    BEEP DURATION=90 FREQUENCY=784 OPTIONAL=1
    BEEP DURATION=90 FREQUENCY=1047 OPTIONAL=1
    BEEP DURATION=220 FREQUENCY=1319 OPTIONAL=1
  {% endif %}

# Stock print preparation tests PA/flow with alternating slow and fast strokes
# about 8 mm above the bed before the separate normal purge and cooldown.
[gcode_macro C5_FLOW_CALIBRATION]
description: Measure stock-style alternating-speed strokes before purge and cooldown
gcode:
  C5_FLOW_STROKES
