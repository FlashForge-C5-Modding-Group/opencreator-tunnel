# Creator 5 Pro hardware for upstream Klipper over the c5-tunnel link.
# Pins and values are transcribed from the stock 1.9.9 configuration
# (printer.base/probe/mesh/vibration/filament/motor.cfg) and the tuned
# printer.cfg. FlashForge-only sections ([mclib *], [ff_eddy *],
# [pa_adjust], [hd_home *], [e_stop *], [stepper_resonance_tester],
# [temp_ctrl]) are not used by upstream Klipper and are omitted.

########################################
# MCUs (USB gadget serial ports bridged by the printer to its UARTs)
########################################

# All four boards implement "reset" but not "config_reset", so the command
# restart method is required.

[mcu]
# mainBoardGD
serial: /dev/ttyGS0
baud: 230400
restart_method: command

[mcu eheaterboard]
serial: /dev/ttyGS1
baud: 230400
restart_method: command

[mcu eboard]
serial: /dev/ttyGS2
baud: 460800
restart_method: command

[mcu levelboard]
# No phase-1 consumer; kept so later calibrations can use its pins.
serial: /dev/ttyGS3
baud: 230400
restart_method: command

[board_pins mc_board]
aliases:
    X_STEP=PJ0, X_DIR=PJ1, X_EN=PJ2, X_ENDSTOP=PJ3,  # stepper_x pin step/enable/dir
    Y_STEP=PJ4, Y_DIR=PJ5, Y_EN=PJ6, Y_ENDSTOP=PJ7,  # stepper_y pin step/enable/dir
    Z_STEP=PJ8, Z_DIR=PJ9, Z_EN=PJ10, Z_ENDSTOP=PJ11,  # stepper_z pin step/enable/dir

########################################
# Motion
########################################

# Motor current, resistance and microstep defaults are applied by the
# mainBoardGD firmware at boot (equal to the stock [mclib stepper_*] values).

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 30000
max_z_velocity: 20
max_z_accel: 300
minimum_cruise_ratio: 0.5
square_corner_velocity: 9

[stepper_x]
step_pin: PJ4
dir_pin: PJ5
enable_pin: !PJ6
microsteps: 16
rotation_distance: 40.4
endstop_pin: PA15
position_endstop: 0
position_max: 310.0
position_min: -5.0
homing_speed: 80
full_steps_per_rotation: 200
step_pulse_duration: 0.000000100
homing_retract_dist: 5
homing_retract_speed: 30
second_homing_speed: 10

[stepper_y]
step_pin: PJ0
dir_pin: !PJ1
enable_pin: !PJ2
microsteps: 16
rotation_distance: 40.4
endstop_pin: !eboard:PA15
position_endstop: 0
position_max: 260.0
position_min: -5.0
homing_speed: 80
full_steps_per_rotation: 200
step_pulse_duration: 0.000000100
homing_retract_dist: 5
homing_retract_speed: 30
second_homing_speed: 10

[stepper_z]
step_pin: Z_STEP
dir_pin: Z_DIR
enable_pin: !Z_EN
microsteps: 16
full_steps_per_rotation: 200
step_pulse_duration: 0.000000100
rotation_distance: 8
gear_ratio: 2.4:1
endstop_pin: probe:z_virtual_endstop
position_max: 270.0
position_min: -10.0
homing_speed: 5
second_homing_speed: 1
homing_retract_dist: 2
homing_retract_speed: 25

[stepper_enable]

[force_move]
enable_force_move: True

[gcode_arcs]
resolution: 1.0

[safe_z_home]
home_xy_position: 130, 130
speed: 200
z_hop: 10
z_hop_speed: 3
move_to_previous: False

# Firmware step-inhibit pins on mainBoardGD; they must stay 0.
[output_pin enable_pin_tmc_x]
pin: PH2
value: 0

[output_pin enable_pin_tmc_y]
pin: PH3
value: 0

########################################
# Probe, mesh, accelerometer
########################################

[probe]
pin: ^!eboard:PG0
x_offset: -13
y_offset: -4
# z_offset lives in printer.cfg's SAVE_CONFIG block (PROBE_CALIBRATE).
speed: 3
lift_speed: 10
samples: 3
sample_retract_dist: 2
samples_tolerance: 0.02
samples_tolerance_retries: 10
samples_result: average

[bed_mesh]
speed: 200
horizontal_move_z: 3
move_check_distance: 3
mesh_min: 0, 0
mesh_max: 250, 250
probe_count: 10, 10
mesh_pps: 3, 3
algorithm: bicubic
bicubic_tension: 0.8

[lis2dw]
cs_pin: eboard:PA4
spi_speed: 4000000
spi_bus: spi1
axes_map: -x, z, y

[resonance_tester]
accel_chip: lis2dw
min_freq: 30
max_freq: 90
probe_points:
    130, 130, 100
accel_per_hz: 60

########################################
# Extruders (four hotends share one extruder stepper on eBoard)
########################################

# Heater control and PID values live in the SAVE_CONFIG block of printer.cfg
# so PID_CALIBRATE + SAVE_CONFIG can update them.

# The 24 V heater rail. The macros in c5_macros.cfg switch it on when a
# hotend target is set; idle_timeout switches it off.
[output_pin DC24V_CTL]
pin: eheaterboard:PA3
value: 1
shutdown_value: 0

# The four extruders share one step/dir pair; eboard:PA3 is both the gear
# stepper enable and the enable_gear_stepper output. Shared stepper enable
# pins (eboard:PB12) need no override.
[duplicate_pin_override]
pins: eboard:PA3, eboard:PB14, eboard:PB15

# min_temp/min_extrude_temp of -200 keep the heaterBoard thermistors from
# faulting while the 24 V rail is off (stock values).
[extruder]
step_pin: eboard:PB14
dir_pin: eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
gear_ratio: 6.5:1
rotation_distance: 19.15
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eheaterboard:PC6
sensor_type: Generic 3950
sensor_pin: eheaterboard:PC0
min_temp: -200
max_temp: 350
min_extrude_temp: -200
pressure_advance: 0.02
pressure_advance_smooth_time: 0.02
max_extrude_only_distance: 500
max_extrude_cross_section: 800
max_extrude_only_velocity: 30
max_extrude_only_accel: 5000
full_steps_per_rotation: 200

[extruder1]
step_pin: eboard:PB14
dir_pin: eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
gear_ratio: 6.5:1
rotation_distance: 19.15
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eheaterboard:PC7
sensor_type: Generic 3950
sensor_pin: eheaterboard:PA4
min_temp: -200
max_temp: 350
min_extrude_temp: -200
pressure_advance: 0.02
pressure_advance_smooth_time: 0.02
max_extrude_only_distance: 500
max_extrude_cross_section: 800
max_extrude_only_velocity: 30
max_extrude_only_accel: 5000
full_steps_per_rotation: 200

[extruder2]
step_pin: eboard:PB14
dir_pin: eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
gear_ratio: 6.5:1
rotation_distance: 19.15
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eheaterboard:PC8
sensor_type: Generic 3950
sensor_pin: eheaterboard:PA5
min_temp: -200
max_temp: 350
min_extrude_temp: -200
pressure_advance: 0.02
pressure_advance_smooth_time: 0.02
max_extrude_only_distance: 500
max_extrude_cross_section: 800
max_extrude_only_velocity: 30
max_extrude_only_accel: 5000
full_steps_per_rotation: 200

[extruder3]
step_pin: eboard:PB14
dir_pin: eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
gear_ratio: 6.5:1
rotation_distance: 19.15
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eheaterboard:PC9
sensor_type: Generic 3950
sensor_pin: eheaterboard:PA7
min_temp: -200
max_temp: 350
min_extrude_temp: -200
pressure_advance: 0.02
pressure_advance_smooth_time: 0.02
max_extrude_only_distance: 500
max_extrude_cross_section: 800
max_extrude_only_velocity: 30
max_extrude_only_accel: 5000
full_steps_per_rotation: 200

[verify_heater extruder]
max_error: 400
check_gain_time: 4000
hysteresis: 10
heating_gain: 10

[heater_fan heat_fan]
pin: eheaterboard:PC11
max_power: 1.0
heater: extruder
heater_temp: 50.0

[heater_fan heat_fan1]
pin: eheaterboard:PA1
max_power: 1.0
heater: extruder1
heater_temp: 50.0

[heater_fan heat_fan2]
pin: eheaterboard:PA6
max_power: 1.0
heater: extruder2
heater_temp: 50.0

[heater_fan heat_fan3]
pin: eheaterboard:PB10
max_power: 1.0
heater: extruder3
heater_temp: 50.0

[temperature_sensor extruder_servo_value]
sensor_type: Generic 3950
sensor_pin: eboard:PA0

########################################
# Tool-lock gear stepper (eBoard, A4988)
########################################

[manual_stepper gear_stepper]
step_pin: eboard:PC14
dir_pin: eboard:PA2
enable_pin: !eboard:PA3
endstop_pin: !eboard:PC15
microsteps: 16
rotation_distance: 0.00215841
full_steps_per_rotation: 20
velocity: 100
accel: 1000

[output_pin A4988_REF]
pin: eboard:PB0
value: 0.25
shutdown_value: 0
cycle_time: 0.00005
pwm: True
hardware_pwm: True

[output_pin enable_gear_stepper]
pin: !eboard:PA3
value: 0

[adc_temperature motor_current_sensor]
temperature1: 0
voltage1: 0
temperature2: 1000
voltage2: 3.3

[temperature_sensor motor_value]
sensor_type: motor_current_sensor
sensor_pin: eboard:PA1

[delayed_gcode LOW_VREF]
initial_duration: 0.0
gcode:
    SET_PIN PIN=A4988_REF VALUE=0.05

########################################
# Bed and chamber
########################################

[heater_bed]
heater_pin: PD2
sensor_type: Generic 3950
sensor_pin: PC3
pullup_resistor: 4700
max_power: 1.0
min_temp: -100
max_temp: 130

[verify_heater heater_bed]
max_error: 200
check_gain_time: 4000
hysteresis: 10
heating_gain: 5

[heater_generic chamber_heater]
gcode_id: C
heater_pin: PE13
max_power: 0.8
sensor_type: Generic 3950
sensor_pin: PC1
# control/PID live in printer.cfg's SAVE_CONFIG block (PID_CALIBRATE).
min_temp: -100
max_temp: 80

[verify_heater chamber_heater]
max_error: 100
heating_gain: 0.1
check_gain_time: 2400
hysteresis: 5

[temperature_sensor ptcTemp]
sensor_type: Generic 3950
sensor_pin: PC0

[temperature_sensor adc_current_value]
sensor_type: Generic 3950
sensor_pin: eheaterboard:PC1

[led chamber_led]
white_pin: PB5
hardware_pwm: False

########################################
# Fans
########################################

[fan_generic fanM106]
pin: eboard:PB5

[controller_fan pcb_fan]
pin: PD14
shutdown_speed: 0
hardware_pwm: false
fan_speed: 1
idle_timeout: 5
idle_speed: 0
stepper: stepper_x,stepper_y,stepper_z

[controller_fan heat_ctl_fan]
pin: PE14
shutdown_speed: 0
hardware_pwm: false
fan_speed: 1
idle_timeout: 5
idle_speed: 0
heater: extruder,extruder1,extruder2,extruder3

[fan_generic chamber_fan]
pin: PE11
hardware_pwm: False

[fan_generic chamber_heat_fan]
pin: PD12
hardware_pwm: False

[fan_generic chamber_loop_fan]
pin: PB10
hardware_pwm: False

[fan_generic chamber_cool_fan]
pin: PE5
hardware_pwm: False

########################################
# Filament sensors
########################################

[filament_switch_sensor fd_ex0]
switch_pin: !eheaterboard:PC13
pause_on_runout: False
event_delay: 1.0

[filament_motion_sensor fm_ex0]
switch_pin: !eheaterboard:PA15
detection_length: 50
extruder: extruder
event_delay: 3.0
pause_on_runout: False
runout_gcode:
    { action_respond_info("wheel runout:T0") }
insert_gcode:
    { action_respond_info("wheel insert:T0") }

[filament_switch_sensor fd_ex1]
switch_pin: !eheaterboard:PC14
pause_on_runout: False
event_delay: 1.0

[filament_motion_sensor fm_ex1]
switch_pin: !eheaterboard:PB13
detection_length: 50
extruder: extruder
event_delay: 3.0
pause_on_runout: False
runout_gcode:
    { action_respond_info("wheel runout:T1") }
insert_gcode:
    { action_respond_info("wheel insert:T1") }

[filament_switch_sensor fd_ex2]
switch_pin: !eheaterboard:PC3
pause_on_runout: False
event_delay: 1.0

[filament_motion_sensor fm_ex2]
switch_pin: !eheaterboard:PB11
detection_length: 50
extruder: extruder
event_delay: 3.0
pause_on_runout: False
runout_gcode:
    { action_respond_info("wheel runout:T2") }
insert_gcode:
    { action_respond_info("wheel insert:T2") }

[filament_switch_sensor fd_ex3]
switch_pin: !eheaterboard:PA2
pause_on_runout: False
event_delay: 1.0

[filament_motion_sensor fm_ex3]
switch_pin: !eheaterboard:PB12
detection_length: 50
extruder: extruder
event_delay: 3.0
pause_on_runout: False
runout_gcode:
    { action_respond_info("wheel runout:T3") }
insert_gcode:
    { action_respond_info("wheel insert:T3") }

########################################
# Door and tool-dock switches (read with QUERY_BUTTON; no actions attached)
########################################

[gcode_button topDoor]
pin: !eheaterboard:PC2
press_gcode:

[gcode_button frontDoor]
pin: !PE0
press_gcode:

[gcode_button extruder_pos1]
pin: ^!eheaterboard:PC12
press_gcode:

[gcode_button extruder_pos2]
pin: ^!eheaterboard:PC4
press_gcode:

[gcode_button extruder_pos3]
pin: ^!eheaterboard:PB14
press_gcode:

[gcode_button extruder_pos4]
pin: ^!eheaterboard:PC5
press_gcode:

[gcode_button extruder_grab1]
pin: ^!eheaterboard:PC10
press_gcode:

[gcode_button extruder_grab2]
pin: ^!eheaterboard:PB6
press_gcode:

[gcode_button extruder_grab3]
pin: ^!eheaterboard:PD2
press_gcode:

[gcode_button extruder_grab4]
pin: ^!eheaterboard:PA12
press_gcode:

########################################
# Host services
########################################

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]
recover_velocity: 50

[display_status]

[exclude_object]

# Stock idle behaviour: heaters and motors off, 24 V heater rail off.
[idle_timeout]
timeout: 600
gcode:
    TURN_OFF_HEATERS
    M84
    SET_PIN PIN=DC24V_CTL VALUE=0
