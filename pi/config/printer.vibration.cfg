[lis2dw]
cs_pin: eboard:PA4
spi_speed: 4000000
spi_bus: spi1
#spi_software_sclk_pin: eboard:PA5
#spi_software_mosi_pin: eboard:PA7
#spi_software_miso_pin: eboard:PA6
axes_map:  -x, z, y

[resonance_tester]
accel_chip:lis2dw
min_freq: 15
max_freq: 133
probe_points:
        130,130,100
accel_per_hz: 150
hz_per_sec: 1

[stepper_resonance_tester]
accel_chip: lis2dw               #corexy printer
x_range: 10, 300                 # axis-x range@mm: min, max
y_range: 10, 300                 # axis-y range@mm: min, max
# stepper_x_center_xy: 130, 130
# stepper_y_center_xy: 130, 130
stepper_x_center_xy: 40, 220
stepper_y_center_xy: 220, 220
# stepper_x_freq / stepper_y_freq (the motors' resonance, 200 Hz if unset) are
# measured by VFA_COMPENSATION and saved by SAVE_CONFIG, so not set here: a
# value in this included file would stop SAVE_CONFIG from saving them.
#vel_range: 5, 30, 0.1            # velocity range@mm/s: min, max, step
# Up to typical wall speeds (300 mm/s). Each test speed is sweep_spacing (8%)
# faster than the last; the step is only used with sweep_spacing: 0
vel_range: 20, 300, 10           # velocity range@mm/s: min, max, step
amp_range: 0.000, 0.050, 0.005   # amplitude range: min, max, step
phase_range: 0.0, 6.28, 1.57     # phase range: min, max, step
#phase_range: 2.8, 3.4, 0.1      # phase range: min, max, step
initial_trial_amp: 0.050 #0.020         # initial trial amp @ mA
min_distortion_threshold: 100    #
td1_amp_initial: 0.010
td1_phase_initial: 0.00
td2_amp_initial: 0.020
td2_phase_initial: 3.14
td4_amp_initial: 0.010
td4_phase_initial: 3.14          # @ rad
load_angle_max: 40               # @ degree

[gcode_macro STEPPER_RESONANCE_FACTORY_CALIBRATE]
gcode:
    # AXIS=X or Y calibrates only that motor; the other keeps what it has.
    # GRAPH=1 also measures the result across the speeds, for the graph
    {% set axis = params.AXIS|default('XY')|upper %}
    {% set graph = params.GRAPH|default(0)|int %}
    _FANS_HOLD SPEED=0.5
    {% for a in ['x', 'y'] if a|upper in axis %}
      # Damping off, then find the motor's resonances (a speed sweep) and
      # calibrate. With two strong resonances it calibrates at each, checks
      # both across the speeds and keeps the one that leaves less vibration
      MCLIB_SET_RESONANCE_DAMP STEPPER=stepper_{a} TDX=1 AMP=0.0 PHASE1=0.0 PHASE2=0.0
      MCLIB_SET_RESONANCE_DAMP STEPPER=stepper_{a} TDX=2 AMP=0.0 PHASE1=0.0 PHASE2=0.0
      MCLIB_SET_RESONANCE_DAMP STEPPER=stepper_{a} TDX=4 AMP=0.0 PHASE1=0.0 PHASE2=0.0
      STEPPER_RESONANCE_AUTO_CALIBRATE STEPPER=stepper_{a} GRAPH={graph}
    {% endfor %}
    _FANS_RELEASE

# Stock firmwareExe.i64's VFA button homes, parks at Z100/X130/Y130, then
# sends STEPPER_RESONANCE_FACTORY_CALIBRATE. Keep this user-facing wrapper
# separate from the low-level calibration routine so it can enforce safety.
[gcode_macro VFA_COMPENSATION]
description: Calibrate X/Y MCLib VFA damping and save it for future prints (AXIS=X or Y for one motor, SAVE=0 to leave saving for later, GRAPH=1 to draw graphs)
gcode:
    {% set axis = params.AXIS|default('XY')|upper %}
    {% if axis not in ['X', 'Y', 'XY'] %}
      { action_raise_error("AXIS must be X, Y or XY") }
    {% endif %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
      { action_raise_error("VFA calibration is unavailable during a print") }
    {% endif %}
    {% for tool in range(1, 5) %}
      {% set grab = printer['gcode_button extruder_grab' ~ tool].state %}
      {% set dock = printer['gcode_button extruder_pos' ~ tool].state %}
      {% if grab != 'RELEASED' or dock != 'PRESSED' %}
        { action_raise_error("Dock all toolheads before VFA calibration") }
      {% endif %}
    {% endfor %}
    G28
    AFC_SELECT_TOOL TOOL=extruder
    G90
    G1 Z100 F1200
    G1 X130 Y130 F6000
    M400
    STEPPER_RESONANCE_FACTORY_CALIBRATE AXIS={axis} GRAPH={params.GRAPH|default(0)|int}
    AFC_UNSELECT_TOOL
    {% if params.GRAPH|default(0)|int %}
      {% for a in ['x', 'y'] if a|upper in axis %}
        RUN_SHELL_COMMAND CMD=oc_vfa_graph PARAMS="stepper_{a}"
      {% endfor %}
      RESPOND MSG="VFA graphs are in the config folder, under vfa/"
    {% endif %}
    {% if params.SAVE|default(1)|int %}
      SAVE_CONFIG
    {% endif %}

[gcode_macro VFA_COMPENSATION_GRAPH]
description: Same as VFA_COMPENSATION, and draws a graph of each motor to config/vfa/ (AXIS=X or Y for one motor, SAVE=0 to leave saving for later)
gcode:
    VFA_COMPENSATION GRAPH=1 AXIS={params.AXIS|default('XY')} SAVE={params.SAVE|default(1)|int}

[gcode_shell_command oc_vfa_graph]
command: $HOME/klippy-env/bin/python $HOME/opencreator-tunnel/pi/moonraker/vfa_graph.py --out-dir $HOME/printer_data/config/vfa
timeout: 120
verbose: True

[gcode_macro STEPPER_RESONANCE_DAMP_DISABLE]
gcode:
    MCLIB_SET_RESONANCE_DAMP STEPPER=stepper_x TDX=1 AMP=0.0000 PHASE1=0.000 PHASE2=0.000
    MCLIB_SET_RESONANCE_DAMP STEPPER=stepper_x TDX=2 AMP=0.0000 PHASE1=0.000 PHASE2=0.000
    MCLIB_SET_RESONANCE_DAMP STEPPER=stepper_x TDX=4 AMP=0.0000 PHASE1=0.000 PHASE2=0.000
    MCLIB_SET_RESONANCE_DAMP STEPPER=stepper_y TDX=1 AMP=0.0000 PHASE1=0.000 PHASE2=0.000
    MCLIB_SET_RESONANCE_DAMP STEPPER=stepper_y TDX=2 AMP=0.0000 PHASE1=0.000 PHASE2=0.000
    MCLIB_SET_RESONANCE_DAMP STEPPER=stepper_y TDX=4 AMP=0.0000 PHASE1=0.000 PHASE2=0.000

[gcode_macro STEPPER_RESONANCE_DAMP_ENABLE]
description: Restore saved X/Y MCLib VFA calibration
gcode:
    M400
    MCLIB_APPLY_CALIBRATION STEPPER=stepper_x
    MCLIB_APPLY_CALIBRATION STEPPER=stepper_y
