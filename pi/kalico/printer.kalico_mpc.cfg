# Kalico only: MPC hotend control for T0-T3. Copy next to printer.cfg;
# it is picked up by [include printer.kalico_mpc*.cfg]. Stock Klipper
# rejects these options, so never install this file there.

[extruder]
control: mpc
heater_power: 50
cooling_fan: fan_generic fanM106
filament_density: 1.20
filament_heat_capacity: 1.80

