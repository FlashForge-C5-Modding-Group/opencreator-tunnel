confirm: {{ gettext('Remove the build plate first. Continue?') }}

[menu __main more c5 calibration offsets_t3]
name: {{ gettext('Offsets T3') }}
icon: fine-tune
method: printer.gcode.script
params: {"script": "C5_CALIBRATE_OFFSETS TOOL=3 Z=1 BUILDPLATE_REMOVED=1"}
confirm: {{ gettext('Remove the build plate first. Continue?') }}

[menu __main more c5 calibration offsets_all]
name: {{ gettext('Offsets: All Tools') }}
icon: fine-tune
method: printer.gcode.script
params: {"script": "C5_CALIBRATE_OFFSETS TOOL=ALL BUILDPLATE_REMOVED=1"}
confirm: {{ gettext('Remove the build plate first. This recalibrates all four tools. Continue?') }}

