[main]
screen_blanking = 1800
screen_blanking_printing = 1800

# The AFC-Klipper-Screen-Add-On's own AFC_menu.conf also includes PREP/
# AFC_CUT/AFC_BRUSH/AFC_KICK/AFC_POOP/AFC_PARK buttons -- those assume
# standard AFC lane-feeder hardware (a filament cutter, a brush) that
# this printer doesn't have; this is a dock-based toolhead swap system
# instead, and none of those macros exist here (confirmed against
# /printer/objects/list). The "AFC status" panel itself is real and
# useful though (it queries printer.afc.status and drives genuine
# macros like AFC_CALIBRATION/AFC_TEST_LANES), so that one entry is
# kept, defined directly below rather than via [include AFC_menu.conf]
# so it isn't silently reintroduced by an add-on update.
[menu __main AFC_status]
name: AFC
panel: AFC
icon: AFC

[menu __print Print_AFC_status]
name: AFC
panel: AFC
icon: AFC

