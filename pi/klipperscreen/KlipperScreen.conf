# C5_CALIBRATE_OFFSETS requires BUILDPLATE_REMOVED=1 as a deliberate
# safety gate (it probes the bare bed/fixture, not through the plate).
# A one-tap button has to bake that param in to work at all, so it asks
# for confirmation first rather than silently overriding the check.
[menu __main more c5 calibration offsets_t0]
name: {{ gettext('Offsets T0') }}
icon: fine-tune
method: printer.gcode.script
params: {"script": "C5_CALIBRATE_OFFSETS TOOL=0 Z=1 BUILDPLATE_REMOVED=1"}
confirm: {{ gettext('Remove the build plate first. Continue?') }}

[menu __main more c5 calibration offsets_t1]
name: {{ gettext('Offsets T1') }}
icon: fine-tune
method: printer.gcode.script
params: {"script": "C5_CALIBRATE_OFFSETS TOOL=1 Z=1 BUILDPLATE_REMOVED=1"}
confirm: {{ gettext('Remove the build plate first. Continue?') }}

[menu __main more c5 calibration offsets_t2]
